name: BQG W5 direct all-M SU(2) commutator audit

on:
  push:
    branches:
      - research/bqg-w5-production-audit-20261113
    paths:
      - '.github/workflows/bqg-w5-direct-all-m-su2.yml'
      - 'scripts/peter_weyl_w5_direct_all_M_su2_gate.py'
      - 'scripts/peter_weyl_covariant_K_sine_composition_gate.py'
      - 'scripts/peter_weyl_covariant_K_leg_gate.py'
      - 'scripts/charged_intertwiner_recoupling_gate.py'
      - 'tests/test_peter_weyl_w5_direct_all_m_su2_gate.py'
  workflow_dispatch:

concurrency:
  group: bqg-w5-direct-all-m-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  direct-all-m:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pruning_mode: [production, shadow_no_prune]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy sympy
      - name: Compile direct all-M covariance gate
        run: python -m py_compile scripts/peter_weyl_w5_direct_all_M_su2_gate.py
      - name: Test fail-closed behavior for empty and invalid operator outputs
        run: python -m unittest discover -s tests -p 'test_peter_weyl_w5_direct_all_m_su2_gate.py' -v
      - name: Run actual sine-H_E all-M commutator
        run: |
          python scripts/peter_weyl_w5_direct_all_M_su2_gate.py \
            --Jmax2 10 \
            --pruning-mode ${{ matrix.pruning_mode }} \
            --output verification_results/direct_all_M_${{ matrix.pruning_mode }}.json
      - name: Upload direct all-M covariance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-direct-all-m-${{ matrix.pruning_mode }}-${{ github.run_id }}
          path: verification_results/direct_all_M_${{ matrix.pruning_mode }}.json
          if-no-files-found: warn
          retention-days: 30
