name: BQG W5 direct all-M SU(2) commutator audit

# Run the full five-node production/shadow commutator audit on the same revision as each
# covariant branch-projection and production-linearity correction.

on:
  push:
    branches:
      - research/bqg-w5-production-audit-20261113
      - research/bqg-intrinsic-clock-lorentzian-bridge-20261116
    paths:
      - '.github/workflows/bqg-w5-direct-all-m-su2.yml'
      - 'scripts/peter_weyl_w5_direct_all_M_su2_gate.py'
      - 'scripts/peter_weyl_covariant_K_sine_composition_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_cached_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_gate.py'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/peter_weyl_covariant_K_leg_gate.py'
      - 'scripts/peter_weyl_covariant_K_projection_audit_gate.py'
      - 'scripts/peter_weyl_covariant_composition_gate.py'
      - 'scripts/peter_weyl_covariant_volume_leg_gate.py'
      - 'scripts/peter_weyl_lorentzian_K_block_gate.py'
      - 'scripts/peter_weyl_volume_cross_rep_audit.py'
      - 'scripts/peter_weyl_q_block_gauge_audit.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - 'scripts/bqg_pruning_audit.py'
      - 'scripts/charged_intertwiner_recoupling_gate.py'
      - 'tests/test_peter_weyl_w5_direct_all_m_su2_gate.py'
      - 'scripts/bqg_w5_direct_all_m_shadow_equivalence.py'
      - 'tests/test_bqg_w5_direct_all_m_shadow_equivalence.py'
  workflow_dispatch:

concurrency:
  group: bqg-w5-direct-all-m-v6-adjacent-m-shards-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  direct-all-m:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pruning_mode: [production, shadow_no_prune]
        node: [0, 1, 2, 3, 4]
        channel: ['0_2', '2_0']
        m_pair: ['-2_0', '0_2']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy sympy
      - name: Compile direct all-M gate and production-shadow comparator
        run: |
          python -m py_compile scripts/peter_weyl_w5_direct_all_M_su2_gate.py
          python -m py_compile scripts/bqg_w5_direct_all_m_shadow_equivalence.py
      - name: Test direct all-M gate and production-shadow comparator
        run: |
          python -m unittest discover -s tests -p 'test_peter_weyl_w5_direct_all_m_su2_gate.py' -v
          python -m unittest discover -s tests -p 'test_bqg_w5_direct_all_m_shadow_equivalence.py' -v
      - name: Run actual sine-H_E all-M commutator
        run: |
          python scripts/peter_weyl_w5_direct_all_M_su2_gate.py \
            --Jmax2 10 \
            --nodes ${{ matrix.node }} \
            --channel '${{ matrix.channel }}' \
            --m-pair '${{ matrix.m_pair }}' \
            --pruning-mode ${{ matrix.pruning_mode }} \
            --output verification_results/direct_all_M_${{ matrix.pruning_mode }}_node${{ matrix.node }}_channel${{ matrix.channel }}_mpair${{ matrix.m_pair == '-2_0' && 'neg2_0' || '0_2' }}.json
      - name: Upload direct all-M covariance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-direct-all-m-${{ matrix.pruning_mode }}-node${{ matrix.node }}-channel${{ matrix.channel }}-mpair${{ matrix.m_pair == '-2_0' && 'neg2_0' || '0_2' }}-${{ github.run_id }}
          path: verification_results/direct_all_M_${{ matrix.pruning_mode }}_node${{ matrix.node }}_channel${{ matrix.channel }}_mpair${{ matrix.m_pair == '-2_0' && 'neg2_0' || '0_2' }}.json
          if-no-files-found: warn
          retention-days: 30

  compare-production-shadow:
    name: Compare production vs shadow_no_prune complete sparse outputs
    if: always()
    needs: direct-all-m
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all forty adjacent-M channel-sharded matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bqg-w5-direct-all-m-*-node*-channel*-mpair*-${{ github.run_id }}
          path: verification_results
          merge-multiple: true
      - name: Compare all five-node, two-channel, all-M production/shadow pairs
        if: always()
        run: |
          python scripts/bqg_w5_direct_all_m_shadow_equivalence.py \
            --directory verification_results \
            --tolerance 1e-10 \
            --output verification_results/PRODUCTION_SHADOW_EQUIVALENCE.json
      - name: Upload aggregate production-shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-production-shadow-equivalence-${{ github.run_id }}
          path: verification_results/PRODUCTION_SHADOW_EQUIVALENCE.json
          if-no-files-found: warn
          retention-days: 30
