name: bqg-real-one-hit-postsum-charge
on:
  push:
    branches:
      - research/bqg-node1-lorentzian-columns-20261031
    paths:
      - .github/workflows/bqg-real-one-hit-postsum-charge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-hit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -u scripts/bqg_real_one_hit_postsum_charge_gate.py --source 1 --target 0
