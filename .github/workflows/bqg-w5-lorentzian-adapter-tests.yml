name: BQG W5 Lorentzian adapter tests

on:
  push:
    branches: [main, research/lemaitre-bqg-causal-cone-20261110]
    paths:
      - 'scripts/bqg_v09_w5_lorentzian_raw_column.py'
      - 'tests/test_bqg_v09_w5_lorentzian_raw_column.py'
      - 'scripts/bqg_v09_w5_lorentzian_gram_aggregate.py'
      - 'scripts/bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'tests/test_bqg_v09_w5_lorentzian_gram_aggregate.py'
      - 'tests/test_bqg_v09_w5_lorentzian_adjoint.py'
      - 'tests/test_bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'BQG_LORENTZIAN_EPSILON_KKV_ADJOINT_AUDIT.md'
      - 'BQG_W5_LORENTZIAN_ADJOINT_CLOSURE.md'
      - '.github/workflows/bqg-w5-lorentzian-adapter-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/bqg_v09_w5_lorentzian_raw_column.py'
      - 'tests/test_bqg_v09_w5_lorentzian_raw_column.py'
      - 'tests/test_bqg_v09_w5_lorentzian_adjoint.py'
      - 'scripts/bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'tests/test_bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'BQG_LORENTZIAN_EPSILON_KKV_ADJOINT_AUDIT.md'
      - 'BQG_W5_LORENTZIAN_ADJOINT_CLOSURE.md'
      - '.github/workflows/bqg-w5-lorentzian-adapter-tests.yml'

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Run W5 adapter unit tests
        run: python -m unittest discover -s tests -p 'test_bqg_v*_w5_lorentzian_*.py' -v
