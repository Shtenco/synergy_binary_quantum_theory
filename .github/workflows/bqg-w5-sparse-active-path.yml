name: BQG W5 sparse active-path regression

on:
  push:
    branches:
      - research/bqg-fs-symplectic-reduction-20261128
    paths:
      - 'scripts/bqg_w5_sparse_active_path_support.py'
      - 'scripts/bqg_w5_sparse_active_path_kkv_pilot.py'
      - 'scripts/bqg_w5_pairwise_factor_graph.py'
      - 'scripts/bqg_w5_su2_structural_basis.py'
      - 'tests/test_bqg_w5_sparse_active_path_support.py'
      - '.github/workflows/bqg-w5-sparse-active-path.yml'

jobs:
  sparse-active-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and test dependencies
        run: python -m pip install numpy sympy pytest
      - name: Run sparse active-path regression tests
        env:
          PYTHONPATH: scripts
        run: python -m pytest tests/test_bqg_w5_sparse_active_path_support.py -q
      - name: Run bounded W5 sparse KKV pilot
        env:
          PYTHONPATH: scripts
        run: python scripts/bqg_w5_sparse_active_path_kkv_pilot.py --K 0 --Jmax2 10 --limit 50000 --source 0 --triple 1 2 3 --mode both
