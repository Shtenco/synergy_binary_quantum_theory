name: q2-pl-graph-export\n\n# Includes the bounded-memmap generation-3 export and manifest reconciliation.

on:
  workflow_dispatch:
  push:
    branches:
      - research/bqg-qfi-q2-emergent-graph-audit-20261118
      - research/bqg-q2-correspondence-audit-hardening-20261119
    paths:
      - 'scripts/q2_pl_graph_export.py'
      - 'tests/test_q2_pl_graph_export.py'
      - 'scripts/q2_causal_pl_correspondence_gate.py'
      - 'tests/test_q2_causal_pl_correspondence_gate.py'
      - 'tests/test_q2_feshbach_correction_gate.py'
      - 'scripts/q2_matrix_free_feshbach.py'
      - 'tests/test_q2_matrix_free_feshbach.py'
      - 'scripts/q2_pl_generation3_preflight.py'
      - 'tests/test_q2_pl_generation3_preflight.py'
      - 'scripts/q2_pl_generation3_stream.py'
      - 'tests/test_q2_pl_generation3_stream.py'
      - 'scripts/q2_relational_edge_qfi_gate.py'
      - 'tests/test_q2_relational_edge_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_EDGE_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_network_qfi_gate.py'
      - 'tests/test_q2_relational_network_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_NETWORK_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_star_qfi_gate.py'
      - 'tests/test_q2_relational_star_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_STAR_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_graph_qfi_gate.py'
      - 'tests/test_q2_relational_graph_qfi_gate.py'
      - 'scripts/q2_relational_gauge_quotient_gate.py'
      - 'tests/test_q2_relational_gauge_quotient_gate.py'
      - 'BQG_Q2_RELATIONAL_GAUGE_QUOTIENT_RESULT_20261118.md'
      - 'scripts/q2_relational_holonomy_quotient_gate.py'
      - 'tests/test_q2_relational_holonomy_quotient_gate.py'
      - 'BQG_Q2_RELATIONAL_HOLONOMY_QUOTIENT_RESULT_20261118.md'
      - 'scripts/q2_relational_holonomy_boundary_tangent_gate.py'
      - 'tests/test_q2_relational_holonomy_boundary_tangent_gate.py'
      - 'BQG_Q2_RELATIONAL_HOLONOMY_BOUNDARY_TANGENT_RESULT_20261118.md'
      - 'scripts/q2_relational_two_sided_endpoint_qfi_gate.py'
      - 'tests/test_q2_relational_two_sided_endpoint_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_TWO_SIDED_ENDPOINT_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_higher_spin_network_qfi_gate.py'
      - 'tests/test_q2_relational_higher_spin_network_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_HIGHER_SPIN_NETWORK_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_haar_averaged_star_qfi_gate.py'
      - 'tests/test_q2_relational_haar_averaged_star_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_HAAR_AVERAGED_STAR_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_higher_spin_graph_qfi_gate.py'
      - 'tests/test_q2_relational_higher_spin_graph_qfi_gate.py'
      - 'BQG_Q2_RELATIONAL_HIGHER_SPIN_GRAPH_QFI_RESULT_20261118.md'
      - 'scripts/q2_relational_joint_gauge_edge_quotient_gate.py'
      - 'tests/test_q2_relational_joint_gauge_edge_quotient_gate.py'
      - 'BQG_Q2_RELATIONAL_JOINT_GAUGE_EDGE_QUOTIENT_RESULT_20261118.md'
      - 'scripts/q2_su2_irrep_singlet_invariance_gate.py'
      - 'tests/test_q2_su2_irrep_singlet_invariance_gate.py'
      - 'BQG_Q2_SU2_IRREP_SINGLET_INVARIANCE_RESULT_20261118.md'
      - 'BQG_Q2_RELATIONAL_GRAPH_QFI_RESULT_20261118.md'
      - '.github/workflows/q2-pl-graph-export.yml'

permissions:
  contents: read

jobs:
  export-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest numpy scipy
      - name: Run deterministic graph export tests
        run: python -m pytest -q tests/test_q2_pl_graph_export.py
      - name: Run causal-to-PL correspondence tests
        run: python -m pytest -q tests/test_q2_causal_pl_correspondence_gate.py
      - name: Run finite Feshbach correction tests
        run: python -m pytest -q tests/test_q2_feshbach_correction_gate.py
      - name: Run matrix-free Feshbach operator controls
        run: python -m pytest -q tests/test_q2_matrix_free_feshbach.py
      - name: Run generation-3 preflight tests
        run: python -m pytest -q tests/test_q2_pl_generation3_preflight.py
      - name: Run relational edge QFI tests
        run: python -m pytest -q tests/test_q2_relational_edge_qfi_gate.py
      - name: Run relational network QFI tests
        run: python -m pytest -q tests/test_q2_relational_network_qfi_gate.py
      - name: Run finite graph relational QFI tests
        run: python -m pytest -q tests/test_q2_relational_graph_qfi_gate.py
      - name: Export finite graph relational QFI control
        run: python scripts/q2_relational_graph_qfi_gate.py --output verification_results/Q2_RELATIONAL_GRAPH_QFI.json
      - name: Run global gauge quotient and two-sided QFI tests
        run: python -m pytest -q tests/test_q2_relational_gauge_quotient_gate.py
      - name: Export global gauge quotient and two-sided QFI control
        run: python scripts/q2_relational_gauge_quotient_gate.py --output verification_results/Q2_RELATIONAL_GAUGE_QUOTIENT.json
      - name: Run finite SU(2) holonomy quotient tests
        run: python -m pytest -q tests/test_q2_relational_holonomy_quotient_gate.py
      - name: Export finite SU(2) holonomy quotient control
        run: python scripts/q2_relational_holonomy_quotient_gate.py --output verification_results/Q2_RELATIONAL_HOLONOMY_QUOTIENT.json
      - name: Run holonomy-to-boundary projective tangent tests
        run: python -m pytest -q tests/test_q2_relational_holonomy_boundary_tangent_gate.py
      - name: Export holonomy-to-boundary projective tangent control
        run: python scripts/q2_relational_holonomy_boundary_tangent_gate.py --output verification_results/Q2_RELATIONAL_HOLONOMY_BOUNDARY_TANGENT.json
      - name: Run two-sided singlet endpoint QFI tests
        run: python -m pytest -q tests/test_q2_relational_two_sided_endpoint_qfi_gate.py
      - name: Export two-sided singlet endpoint QFI control
        run: python scripts/q2_relational_two_sided_endpoint_qfi_gate.py --output verification_results/Q2_RELATIONAL_TWO_SIDED_ENDPOINT_QFI.json
      - name: Run higher-spin four-valent network QFI tests
        run: python -m pytest -q tests/test_q2_relational_higher_spin_network_qfi_gate.py
      - name: Export higher-spin four-valent network QFI control
        run: python scripts/q2_relational_higher_spin_network_qfi_gate.py --output verification_results/Q2_RELATIONAL_HIGHER_SPIN_NETWORK_QFI.json
      - name: Run joint vertex-Gauss and singlet-edge quotient tests
        run: python -m pytest -q tests/test_q2_relational_joint_gauge_edge_quotient_gate.py
      - name: Export joint vertex-Gauss and singlet-edge quotient
        run: python scripts/q2_relational_joint_gauge_edge_quotient_gate.py --output verification_results/Q2_RELATIONAL_JOINT_GAUGE_EDGE_QUOTIENT.json
      - name: Run higher-spin graph path and cycle QFI tests
        run: python -m pytest -q tests/test_q2_relational_higher_spin_graph_qfi_gate.py
      - name: Export higher-spin graph path and cycle QFI
        run: python scripts/q2_relational_higher_spin_graph_qfi_gate.py --output verification_results/Q2_RELATIONAL_HIGHER_SPIN_GRAPH_QFI.json
      - name: Run Haar-averaged star QFI tests
        run: python -m pytest -q tests/test_q2_relational_haar_averaged_star_qfi_gate.py
      - name: Export Haar-averaged star QFI control
        run: python scripts/q2_relational_haar_averaged_star_qfi_gate.py --output verification_results/Q2_RELATIONAL_HAAR_AVERAGED_STAR_QFI.json
      - name: Run arbitrary-irrep SU(2) singlet invariance tests
        run: python -m pytest -q tests/test_q2_su2_irrep_singlet_invariance_gate.py
      - name: Export arbitrary-irrep SU(2) singlet invariance control
        run: python scripts/q2_su2_irrep_singlet_invariance_gate.py --output verification_results/Q2_SU2_IRREP_SINGLET_INVARIANCE.json
      - name: Run four-valent star QFI tests
        run: python -m pytest -q tests/test_q2_relational_star_qfi_gate.py
      - name: Export four-valent star QFI control
        run: python scripts/q2_relational_star_qfi_gate.py --output verification_results/Q2_RELATIONAL_STAR_QFI.json
      - name: Export two-block relational edge QFI control
        run: python scripts/q2_relational_edge_qfi_gate.py --output verification_results/Q2_RELATIONAL_EDGE_QFI.json
      - name: Export three-node relational network QFI control
        run: python scripts/q2_relational_network_qfi_gate.py --output verification_results/Q2_RELATIONAL_NETWORK_QFI.json
      - name: Run generation-3 allocation-free capacity preflight
        run: python scripts/q2_pl_generation3_preflight.py --output verification_results/Q2_PL_GENERATION3_PREFLIGHT.json
      - name: Run compact generation-3 dual and causal-fibre regression
        run: python -m pytest -q tests/test_q2_pl_generation3_stream.py
      - name: Export compact generation-3 dual and causal-fibre evidence
        run: python scripts/q2_pl_generation3_stream.py --output verification_results/Q2_PL_GENERATION3_COMPACT_GATE.json
      - name: Export finite causal-to-PL correspondence
        run: python scripts/q2_causal_pl_correspondence_gate.py --max-generation 2 --output verification_results/Q2_CAUSAL_PL_CORRESPONDENCE.json
      - name: Export finite zero-energy Feshbach corrections
        run: python scripts/q2_causal_pl_correspondence_gate.py --max-generation 2 --feshbach --output verification_results/Q2_FESHBACH_CORRECTION.json
      - name: Export all audited PL refinement levels
        run: python scripts/q2_pl_graph_export.py --max-generation 2 --output verification_results/Q2_PL_GRAPH_EXPORT.json
      - name: Upload graph identity and adjacency artifact
        uses: actions/upload-artifact@v4
        with:
          name: q2-pl-graph-export
          path: |
            verification_results/Q2_PL_GRAPH_EXPORT.json
            verification_results/Q2_CAUSAL_PL_CORRESPONDENCE.json
            verification_results/Q2_FESHBACH_CORRECTION.json
            verification_results/Q2_PL_GENERATION3_PREFLIGHT.json
            verification_results/Q2_PL_GENERATION3_COMPACT_GATE.json\n            verification_results/g3_chunked/G3_CHUNKED_MANIFEST.json\n            verification_results/g3_chunked/*.npy
            verification_results/Q2_RELATIONAL_EDGE_QFI.json
            verification_results/Q2_RELATIONAL_NETWORK_QFI.json
            verification_results/Q2_RELATIONAL_STAR_QFI.json
            verification_results/Q2_RELATIONAL_GRAPH_QFI.json
            verification_results/Q2_RELATIONAL_GAUGE_QUOTIENT.json
            verification_results/Q2_RELATIONAL_HOLONOMY_QUOTIENT.json
            verification_results/Q2_RELATIONAL_HOLONOMY_BOUNDARY_TANGENT.json
            verification_results/Q2_RELATIONAL_TWO_SIDED_ENDPOINT_QFI.json
            verification_results/Q2_SU2_IRREP_SINGLET_INVARIANCE.json
            verification_results/Q2_RELATIONAL_HIGHER_SPIN_NETWORK_QFI.json
            verification_results/Q2_RELATIONAL_HAAR_AVERAGED_STAR_QFI.json
            verification_results/Q2_RELATIONAL_HIGHER_SPIN_GRAPH_QFI.json
            verification_results/Q2_RELATIONAL_JOINT_GAUGE_EDGE_QUOTIENT.json
          if-no-files-found: error
