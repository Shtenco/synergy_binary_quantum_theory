name: BQG sparse pruning reference tests

on:
  push:
    branches:
      - "**"
    paths:
      - "scripts/bqg_sparse_pruning.py"
      - "scripts/test_bqg_sparse_pruning.py"
      - "scripts/k5_peter_weyl_safe_hda_column.py"
      - "scripts/test_k5_sparse_policy_wiring.py"
      - "scripts/test_bqg_sparse_dense_oracle.py"
      - "scripts/test_k5_volume_raw_operator.py"
      - "scripts/test_k5_hit_adjoint.py"
      - "scripts/test_k5_primitive_dense_adjoint.py"
      - "scripts/test_k5_assembled_node_hermiticity.py"
      - "scripts/test_k5_rectangular_node_h_adjointness.py"
      - "scripts/peter_weyl_master_projector_pilot.py"
      - "scripts/test_peter_weyl_master_projector_integrity.py"
      - "scripts/peter_weyl_constraint_stability.py"
      - "scripts/test_peter_weyl_constraint_stability.py"
      - ".github/workflows/bqg-sparse-pruning.yml"
  pull_request:
    paths:
      - "scripts/bqg_sparse_pruning.py"
      - "scripts/test_bqg_sparse_pruning.py"
      - "scripts/k5_peter_weyl_safe_hda_column.py"
      - "scripts/test_k5_sparse_policy_wiring.py"
      - "scripts/test_bqg_sparse_dense_oracle.py"
      - "scripts/test_k5_volume_raw_operator.py"
      - "scripts/test_k5_hit_adjoint.py"
      - "scripts/test_k5_primitive_dense_adjoint.py"
      - "scripts/test_k5_assembled_node_hermiticity.py"
      - "scripts/test_k5_rectangular_node_h_adjointness.py"
      - "scripts/peter_weyl_master_projector_pilot.py"
      - "scripts/test_peter_weyl_master_projector_integrity.py"
      - "scripts/peter_weyl_constraint_stability.py"
      - "scripts/test_peter_weyl_constraint_stability.py"
      - ".github/workflows/bqg-sparse-pruning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-pruning-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical test dependency
        run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Run committed sparse-pruning regression tests
        run: python scripts/test_bqg_sparse_pruning.py
      - name: Run K5 policy wiring tests
        run: python scripts/test_k5_sparse_policy_wiring.py
      - name: Run independent synthetic dense-oracle and adjoint tests
        run: python scripts/test_bqg_sparse_dense_oracle.py
      - name: Run production K5 raw volume operator tests
        run: python scripts/test_k5_volume_raw_operator.py
      - name: Run production K5 link-hit adjoint tests
        run: python scripts/test_k5_hit_adjoint.py
      - name: Run finite-sector production K5 primitive dense-adjoint oracle
        run: python scripts/test_k5_primitive_dense_adjoint.py
      - name: Run finite-sector assembled production K5 node-H Hermiticity oracle
        run: python scripts/test_k5_assembled_node_hermiticity.py
      - name: Run rectangular projected finite-sector production K5 node-H adjointness oracle
        run: python scripts/test_k5_rectangular_node_h_adjointness.py
      - name: Run finite Peter-Weyl master-projector integrity gates
        run: python scripts/test_peter_weyl_master_projector_integrity.py
      - name: Run legacy/no-prune constraint-map perturbation dense-oracle gates
        run: python scripts/test_peter_weyl_constraint_stability.py
