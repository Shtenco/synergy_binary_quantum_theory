name: W5 production source staging bundle

on:
  push:
    branches:
      - research/physical-history-causality-20261112
    paths:
      - .github/workflows/w5-production-source-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-production-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited research branch
        uses: actions/checkout@v4
        with:
          ref: research/physical-history-causality-20261112
      - name: Build deterministic source bundle and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -a scripts staging/scripts
          find staging/scripts -type f -print0 | sort -z | xargs -0 sha256sum > staging/SHA256SUMS.txt
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('staging')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          manifest = {
              'repository': 'Shtenco/synergy_binary_quantum_theory',
              'ref': 'research/physical-history-causality-20261112',
              'purpose': 'read-only local staging of production W5 scripts and dependencies',
              'files': [{'path': str(p.relative_to(root)), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with zipfile.ZipFile('w5-production-scripts.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root))
          print(json.dumps({'files': len(files), 'zip_bytes': pathlib.Path('w5-production-scripts.zip').stat().st_size}, indent=2))
          PY
      - name: Upload production source bundle
        uses: actions/upload-artifact@v4
        with:
          name: w5-production-scripts-${{ github.sha }}
          path: w5-production-scripts.zip
          if-no-files-found: error
          retention-days: 7
