name: BQG production linearity L1 audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/lemaitre-bqg-causal-cone-20261110
      - research/bqg-w5-production-audit-20261113
    paths:
      - 'scripts/bqg_sparse_linear_accumulator.py'
      - 'tests/test_bqg_production_linearity.py'
      - '.github/workflows/bqg-production-linearity-l1.yml'

permissions:
  contents: read

jobs:
  l1-accumulator-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy sympy
      - name: Compile L1 reference and production modules
        run: |
          python -m py_compile scripts/bqg_sparse_linear_accumulator.py
          python -m py_compile scripts/peter_weyl_covariant_composition_gate.py
          python -m py_compile scripts/peter_weyl_covariant_K_leg_gate.py
      - name: Run L1 characterization and strict-reference tests
        run: python -m unittest discover -s tests -p 'test_bqg_production_linearity.py' -v
