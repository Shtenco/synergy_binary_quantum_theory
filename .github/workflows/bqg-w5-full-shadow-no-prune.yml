name: BQG W5 full shadow no-prune matrix diagnostic

on:
  push:
    branches:
      - research/bqg-w5-production-audit-20261113
    paths:
      - '.github/workflows/bqg-w5-full-shadow-no-prune.yml'
      - 'scripts/bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'scripts/bqg_v10_w5_amp_tol_shadow_compare.py'
      - 'scripts/bqg_pruning_audit.py'
      - 'scripts/bqg_pruning_coverage_inventory.py'
      - 'scripts/bqg_sparse_linear_accumulator.py'
      - 'scripts/peter_weyl_lorentzian_sine_ordered_triple_gate.py'
      - 'scripts/peter_weyl_lorentzian_ordered_triple_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_cached_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_gate.py'
      - 'scripts/peter_weyl_covariant_K_leg_gate.py'
      - 'scripts/peter_weyl_covariant_volume_leg_gate.py'
      - 'scripts/peter_weyl_covariant_composition_gate.py'
      - 'scripts/peter_weyl_covariant_K_sine_composition_gate.py'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/peter_weyl_lorentzian_K_block_gate.py'
      - 'scripts/charged_intertwiner_recoupling_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - 'scripts/bqg_w5_shadow_no_prune_shard_aggregate.py'
      - 'tests/test_bqg_w5_shadow_no_prune_shard_aggregate.py'
  workflow_dispatch:

concurrency:
  group: bqg-w5-full-shadow-no-prune-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-shadow-matrix:
    name: Shadow ${{ matrix.pruning_mode }} J${{ matrix.jmax2 }} node${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        jmax2: [10, 12, 14]
        node: [0, 1, 2, 3, 4]
        pruning_mode: [production, shadow_no_prune]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy sympy
      - name: Compile direct closure and paired aggregator
        run: |
          python -m py_compile scripts/bqg_v10_w5_lorentzian_adjoint_closure.py
          python -m py_compile scripts/bqg_w5_shadow_no_prune_shard_aggregate.py
          python -m unittest discover -s tests -p 'test_bqg_w5_shadow_no_prune_shard_aggregate.py' -v
      - name: Run one fresh production/shadow closure process
        shell: bash
        run: |
          mkdir -p verification_results
          set +e
          python scripts/bqg_v10_w5_lorentzian_adjoint_closure.py \
            --nodes ${{ matrix.node }} --seed-K 0 2 4 6 8 \
            --Jmax2 ${{ matrix.jmax2 }} --unbounded-closure \
            --amp-tol 1e-12 --cache-mode on \
            --pruning-mode ${{ matrix.pruning_mode }} \
            --output verification_results/W5_SHADOW_MATRIX_J${{ matrix.jmax2 }}_NODE${{ matrix.node }}_MODE${{ matrix.pruning_mode }}_RUN${{ github.run_id }}.json
          rc=$?
          set -e
          test -f verification_results/W5_SHADOW_MATRIX_J${{ matrix.jmax2 }}_NODE${{ matrix.node }}_MODE${{ matrix.pruning_mode }}_RUN${{ github.run_id }}.json
          python - "$rc" "verification_results/W5_SHADOW_MATRIX_J${{ matrix.jmax2 }}_NODE${{ matrix.node }}_MODE${{ matrix.pruning_mode }}_RUN${{ github.run_id }}.json" "${{ matrix.pruning_mode }}" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          report = json.load(open(sys.argv[2], encoding="utf-8"))
          mode = sys.argv[3]
          if mode == "production":
              assert rc == 0 and report.get("status") == "PASS_ADJOINT_CONSISTENCY", report.get("status")
          else:
              assert rc == 2 and report.get("status") == "INCOMPLETE_NO_PRUNING_COVERAGE", report.get("status")
              assert report.get("algebraic_status") == "PASS_ADJOINT_CONSISTENCY"
          assert report.get("max_states") is None and report.get("max_depth") is None
          assert report.get("seed_Ks") == [0, 2, 4, 6, 8]
          assert report.get("forward_B_columns_sparse")
          assert report.get("direct_Bdag_columns_sparse")
          print("single-mode W5 matrix shard: PASS (finite diagnostic only)")
          PY
      - name: Upload single-mode shadow matrix shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-shadow-matrix-j${{ matrix.jmax2 }}-node${{ matrix.node }}-mode${{ matrix.pruning_mode }}-${{ github.run_id }}
          path: verification_results/W5_SHADOW_MATRIX_J${{ matrix.jmax2 }}_NODE${{ matrix.node }}_MODE${{ matrix.pruning_mode }}_RUN${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-full-shadow:
    name: Aggregate all 15 finite production/shadow pairs
    if: always()
    needs: full-shadow-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install comparison dependencies
        run: python -m pip install numpy
      - name: Download all single-mode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bqg-w5-shadow-matrix-j*-node*-mode*-${{ github.run_id }}
          path: verification_results
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Compare paired full matrices and preserve incomplete claim boundary
        if: always()
        run: python scripts/bqg_w5_shadow_no_prune_shard_aggregate.py --directory verification_results --Jmax2 10 12 14 --output verification_results/W5_FULL_SHADOW_AGGREGATE.json
      - name: Upload aggregate shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-full-shadow-aggregate-${{ github.run_id }}
          path: verification_results/W5_FULL_SHADOW_AGGREGATE.json
          if-no-files-found: warn
          retention-days: 30
