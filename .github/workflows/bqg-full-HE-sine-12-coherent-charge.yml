name: bqg-full-HE-sine-12-coherent-charge
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-full-HE-sine-12-coherent-charge.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full-he-sine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Exact projected 12 orientations from one genuine K5 SU2 charged source
        run: |
          python -m py_compile scripts/bqg_he_sine_full12_charge_closure.py
          python -u scripts/bqg_he_sine_full12_charge_closure.py --source 1 --target 0 --Jmax2 3
