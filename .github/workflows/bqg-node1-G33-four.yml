name: bqg-node1-G33-four
on:
  push:
    branches:
      - research/bqg-node1-lorentzian-columns-20261031
    paths:
      - .github/workflows/bqg-node1-G33-four.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        index: [51, 25, 115, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: 41294081280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: node1-kb-000
          path: checkpoint
      - name: Real full KA output from frozen KB
        env:
          IDX: ${{ matrix.index }}
        run: |
          python -u scripts/bqg_lorentzian_ka_partition.py --mode part --checkpoint-dir checkpoint --source 1 --column-index 0 --a 0 --b 2 --c 3 --channel 000 --parts 120 --part-index "$IDX"
      - name: Verify NPZ and emit complete evidence in log
        env:
          IDX: ${{ matrix.index }}
        run: |
          python - <<'PY'
          import os,json,hashlib,base64,numpy as np
          from pathlib import Path
          i=int(os.environ['IDX'])
          p=Path(f'checkpoint/ka_000_part{i:03d}_of120')
          m=json.loads(p.with_suffix('.json').read_text())
          b=p.with_suffix('.npz').read_bytes()
          assert m['sha256']==hashlib.sha256(b).hexdigest()
          assert m['part_index']==i and m['parts']==120 and m['rows']==1
          assert m['kb_sha256']=='f486e2250d4a5678a34438467b9e338d730ebf6e1d1ec956d2de7f8c2521b293'
          with np.load(p.with_suffix('.npz'),allow_pickle=False) as a:
              n=len(a['amp'])
              assert n==m['support']
              assert a['spins'].shape==(n,10)
              assert a['Kother'].shape==(n,5)
              assert a['charges'].shape==(n,4)
              assert np.isfinite(a['amp'].real).all() and np.isfinite(a['amp'].imag).all()
              assert abs(np.linalg.norm(a['amp'])-m['norm'])<1e-12
          print('BQG_EVIDENCE_BEGIN',i,flush=True)
          print('BQG_METADATA',json.dumps(m,separators=(',',':')),flush=True)
          print('BQG_NPZ_BASE64',base64.b64encode(b).decode('ascii'),flush=True)
          print('BQG_EVIDENCE_END',i,flush=True)
          PY
