name: bqg-HE-sine-two-source-physical-kernel-gate
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-HE-sine-two-source-physical-kernel-gate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  two-dimensional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - name: Exact two real charged-source Gram of H_E sine from SHA-checked wavefunctions
        run: python -u scripts/bqg_HE_sine_two_charged_sources_gram.py
