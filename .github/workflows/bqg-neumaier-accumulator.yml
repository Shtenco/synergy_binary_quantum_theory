name: BQG Neumaier accumulator candidate tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/bqg_neumaier_sparse_accumulator.py"
      - "tests/test_bqg_neumaier_sparse_accumulator.py"
      - ".github/workflows/bqg-neumaier-accumulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/bqg_neumaier_sparse_accumulator.py"
      - "tests/test_bqg_neumaier_sparse_accumulator.py"
      - ".github/workflows/bqg-neumaier-accumulator.yml"

permissions:
  contents: read

jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run candidate accumulator tests
        run: python -m pytest -q tests/test_bqg_neumaier_sparse_accumulator.py
