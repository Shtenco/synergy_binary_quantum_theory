name: qag-postselection-regression

on:
  push:
    branches: [main]
    paths:
      - "qag_postselection.py"
      - "qag_periodic_probe.py"
      - "tests/test_qag_postselection.py"
      - "tests/test_qag_periodic_probe.py"
      - ".github/workflows/qag-postselection-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "qag_postselection.py"
      - "tests/test_qag_postselection.py"
      - ".github/workflows/qag-postselection-regression.yml"

permissions:
  contents: read

jobs:
  qag-finite-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependency
        run: python -m pip install "numpy>=1.24"
      - name: Compile QAG module and tests
        run: python -m py_compile qag_postselection.py tests/test_qag_postselection.py
      - name: Run QAG regression suite
        run: python -m unittest discover -s tests -p "test_qag_postselection.py" -v
