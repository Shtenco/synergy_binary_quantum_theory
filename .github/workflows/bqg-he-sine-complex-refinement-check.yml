name: bqg-he-sine-complex-refinement-check
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-he-sine-complex-refinement-check.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify exact SHA-checked SU2 complex full outputs across spin refinements
        run: python -u scripts/bqg_he_sine_compare_refinement.py
