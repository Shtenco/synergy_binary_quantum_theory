name: BQG black-hole reduced gates

on:
  push:
    branches:
      - main
      - research/bqg-infoton-black-holes-20261120
    paths:
      - "scripts/bqg_black_hole_reduced_gates.py"
      - "scripts/bqg_infoton_bh_foundation_gate.py"
      - "scripts/bqg_common_gauss_habitat_audit.py"
      - "research/black_holes_bqg/**"
      - ".github/workflows/bqg-black-hole-reduced-gates.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/bqg_black_hole_reduced_gates.py"
      - "scripts/bqg_infoton_bh_foundation_gate.py"
      - "scripts/bqg_common_gauss_habitat_audit.py"
      - "research/black_holes_bqg/**"
      - ".github/workflows/bqg-black-hole-reduced-gates.yml"

concurrency:
  group: bqg-black-hole-reduced-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reduced-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal numerical dependency
        run: python -m pip install "numpy>=1.24"
      - name: Compile research gates
        run: python -m py_compile scripts/bqg_black_hole_reduced_gates.py scripts/bqg_infoton_bh_foundation_gate.py scripts/bqg_common_gauss_habitat_audit.py
      - name: Run shared infoton and Page-curve finite controls
        run: |
          python scripts/bqg_infoton_bh_foundation_gate.py > /tmp/bqg_foundation_gates.json
          python -c "import json; d=json.load(open('/tmp/bqg_foundation_gates.json')); print(json.dumps({'passed': d['passed'], 'physical_inputs_still_missing': d['physical_inputs_still_missing']}, indent=2)); assert d['passed']"
      - name: Audit common Gauss-key habitat for actual Euclidean and Lorentzian maps
        run: |
          python scripts/bqg_common_gauss_habitat_audit.py > /tmp/bqg_common_habitat.json
          python -c "import json; d=json.load(open('/tmp/bqg_common_habitat.json')); print(json.dumps({'passed': d['passed'], 'union_supports': d['union_supports'], 'checks': d['checks']}, indent=2)); assert d['passed']"
      - name: Run BH-1 through BH-7 reduced controls
        run: |
          python scripts/bqg_black_hole_reduced_gates.py > /tmp/bqg_bh_gates.json
          python -c "import json; d=json.load(open('/tmp/bqg_bh_gates.json')); print(json.dumps({k:v['passed'] for k,v in d['gates'].items()}, indent=2)); assert d['passed_reduced_controls']"
