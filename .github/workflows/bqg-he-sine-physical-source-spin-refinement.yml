name: bqg-he-sine-physical-source-spin-refinement
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-he-sine-physical-source-spin-refinement.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cutoff:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        Jmax2: [3, 5, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Genuine complete 12-orientation sine HE with full complex outgoing state
        env:
          J2: ${{ matrix.Jmax2 }}
        run: |
          python -u scripts/bqg_he_sine_full_cutoff_refinement.py --source 1 --target 0 --Jmax2 "$J2"
