name: bqg-node1-kb-leakage-replay
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-node1-kb-leakage-replay.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/bqg_node1_kb_leakage_replay.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 41294081280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: node1-kb-000
          path: checkpoint
      - name: Replay original KB and diagnose unprojected primitive leakage
        run: |
          python -u scripts/bqg_node1_kb_leakage_replay.py \
            --checkpoint-dir checkpoint --output kb_leakage_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bqg-node1-kb-leakage-replay
          path: kb_leakage_report.json
          if-no-files-found: warn
          retention-days: 30
