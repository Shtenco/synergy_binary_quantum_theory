name: BQG depth6 [3,2] Stage-A keymeta salvage
on:
  workflow_run:
    workflows: ["BQG depth6 mixed stage A"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Stage-A workflow run ID to salvage
        required: true
        default: '36899125190'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/bqg-depth6-32-keymeta-salvage.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: bqg-depth6-32-keymeta-salvage
  cancel-in-progress: false

jobs:
  salvage-keymeta:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof
          path: proofsrc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Resolve Stage-A source run
        id: src
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            rid="${{ github.event.workflow_run.id }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rid="${{ inputs.source_run_id }}"
          else
            # Immediate preservation trigger while the known Stage-A run is still active.
            # This does not recompute any structural or Hamiltonian data; it only
            # salvages artifacts that already exist at trigger time.
            rid="36899125190"
          fi
          test -n "${rid}"
          echo "run_id=${rid}" >> "$GITHUB_OUTPUT"
          echo "SALVAGE_SOURCE_RUN=${rid}"
      - name: Verify pinned branch harvester, extractor, and safety helpers
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git -C proofsrc hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "Pinned source mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          }
          verify_blob scripts/harvest_stagea_keymeta.py c0f79e2552088984f8f4566b29f16c726e63cc92
          verify_blob mixed_parallel/extract_master_key_metadata.py 41b50f59d3c068ef5472ebdc6a8971074ecbcf8c
          verify_blob proof_tools/safe_archive.py f72190f9fb8e4a6b4f01e31acfaf60b7232e7aea
          verify_blob proof_tools/safe_pickle.py f2ed47a157819a538275572c802c22ed58b0fadc
      - name: Harvest matching raw shards one-at-a-time into tiny key metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u proofsrc/scripts/harvest_stagea_keymeta.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${{ steps.src.outputs.run_id }}" \
            --prefix bqg-mixed-32-shard- \
            --expected-shards 112 \
            --extractor proofsrc/mixed_parallel/extract_master_key_metadata.py \
            --out-dir stagea32_keymeta \
            --engine-git-blob-sha 41b50f59d3c068ef5472ebdc6a8971074ecbcf8c
      - name: Show salvage manifest
        run: cat stagea32_keymeta/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-depth6-32-stagea-keymeta-salvage-${{ steps.src.outputs.run_id }}
          path: stagea32_keymeta
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
