name: Stage W5 production source for local audit

on:
  push:
    branches:
      - research/lemaitre-bqg-causal-cone-20261110
    paths:
      - .github/workflows/stage-w5-production-source.yml

permissions:
  contents: read

jobs:
  stage-production-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Package production scripts and project metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/k5_peter_weyl_safe_hda_column.py
          test -f scripts/peter_weyl_covariant_K_leg_gate.py
          test -f scripts/peter_weyl_covariant_volume_leg_gate.py
          test -f scripts/peter_weyl_covariant_composition_gate.py
          test -f scripts/peter_weyl_covariant_K_composition_gate.py
          test -f scripts/peter_weyl_lorentzian_ordered_triple_gate.py
          mkdir -p /tmp/w5-source-stage
          cp -a scripts /tmp/w5-source-stage/
          for f in pyproject.toml requirements.txt setup.cfg pytest.ini; do
            if test -f "$f"; then cp "$f" /tmp/w5-source-stage/; fi
          done
          printf '%s\n' "$GITHUB_SHA" > /tmp/w5-source-stage/SOURCE_COMMIT.txt
          tar -czf w5-production-source.tar.gz -C /tmp w5-source-stage
      - name: Upload source archive for local execution
        uses: actions/upload-artifact@v4
        with:
          name: w5-production-source
          path: w5-production-source.tar.gz
          if-no-files-found: error
          retention-days: 7
