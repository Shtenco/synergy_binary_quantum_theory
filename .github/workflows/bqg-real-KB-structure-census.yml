name: bqg-real-KB-structure-census
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-real-KB-structure-census.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          run-id: 41294081280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: node1-kb-000
          path: checkpoint
      - run: python -u scripts/bqg_node1_kb_structure_census.py
