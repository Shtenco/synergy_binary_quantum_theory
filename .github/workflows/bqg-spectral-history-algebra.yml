name: BQG spectral-history algebraic regression

on:
  push:
    branches: ['**']
    paths:
      - 'BQG_SPECTRAL_HISTORY_GRAPH.md'
      - 'scripts/bqg_spectral_history_graph_gate.py'
      - 'tests/test_bqg_spectral_history_regression.py'
      - '.github/workflows/bqg-spectral-history-algebra.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'BQG_SPECTRAL_HISTORY_GRAPH.md'
      - 'scripts/bqg_spectral_history_graph_gate.py'
      - 'tests/test_bqg_spectral_history_regression.py'
      - '.github/workflows/bqg-spectral-history-algebra.yml'

permissions:
  contents: read

concurrency:
  group: bqg-spectral-history-algebra-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  algebraic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Compile spectral-history source and tests
        run: python -m py_compile scripts/bqg_spectral_history_graph_gate.py tests/test_bqg_spectral_history_regression.py
      - name: Deterministic block-Lanczos closure regression
        run: python scripts/bqg_spectral_history_graph_gate.py --mode regression --output verification_results/BQG_SPECTRAL_HISTORY_REGRESSION.json
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_bqg_spectral_history_regression.py' -v
      - name: Upload algebraic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-spectral-history-algebraic-evidence
          path: verification_results/BQG_SPECTRAL_HISTORY_REGRESSION.json
          if-no-files-found: error
