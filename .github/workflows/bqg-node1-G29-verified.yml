name: bqg-node1-G29-verified
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-node1-G29-verified.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  gram29:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          run-id: 41294081280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: node1-kb-000
          path: data
      - uses: actions/download-artifact@v4
        with:
          run-id: 41304021860
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: node1-ka-key-*
          merge-multiple: true
          path: data
      - uses: actions/download-artifact@v4
        with:
          run-id: 41309076252
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: bqg-node1-ka-lowspin-*
          merge-multiple: true
          path: data
      - name: SHA verify all 29 real complex output vectors and compute coherent Gram
        run: python -u scripts/bqg_node1_g29_git.py --run 42130349763 --data data --repo-root .
