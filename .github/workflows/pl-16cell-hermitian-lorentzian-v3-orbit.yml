name: pl-16cell-hermitian-lorentzian-v3-orbit

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
      - audit/pl48-volume-failclosed-20261110
      - audit/pl48-spectral-complete-20261110
    paths:
      - 'PL_16CELL_HERMITIAN_LORENTZIAN_PREREGISTRATION_V3_ORBIT.md'
      - 'scripts/tetrahedral_volume_backend.py'
      - 'scripts/tetrahedral_charged_volume_audit_gate.py'
      - 'scripts/tetrahedral_volume_s4_covariance_gate.py'
      - 'tests/test_tetrahedral_volume_spectral.py'
      - 'scripts/lorentzian_pairing_stabilizer_orbit_gate.py'
      - 'scripts/collective_16cell_pairing_stabilizer_covariance_gate.py'
      - 'scripts/pl_lorentzian_triple_worker.py'
      - 'scripts/pl_lorentzian_group_worker.py'
      - 'scripts/pl_lorentzian_group_worker_v2.py'
      - 'scripts/pl_lorentzian_orbit_reconstruct_v3.py'
      - 'scripts/pl_lorentzian_48_collect.py'
      - 'scripts/pl_lorentzian_48_collect_v2.py'
      - 'scripts/pl_lorentzian_48_collect_v3.py'
      - 'scripts/pl_lorentzian_v2_v3_complex_state_compare.py'
      - '.github/workflows/pl-16cell-hermitian-lorentzian-v3-orbit.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile \
            scripts/lorentzian_pairing_stabilizer_orbit_gate.py \
            scripts/collective_16cell_pairing_stabilizer_covariance_gate.py \
            scripts/pl_lorentzian_orbit_reconstruct_v3.py \
            scripts/pl_lorentzian_48_collect_v3.py \
            scripts/pl_lorentzian_v2_v3_complex_state_compare.py \\
            scripts/tetrahedral_volume_s4_covariance_gate.py
      - name: Tetrahedral charged-volume audit and raw spectral matrix export
        run: python scripts/tetrahedral_charged_volume_audit_gate.py --output verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT_V3.json --matrix-output verification_results/TETRAHEDRAL_CHARGED_VOLUME_SPECTRAL_MATRICES_V3.npz
      - name: Independent full-local S4 covariance regression
        run: python scripts/tetrahedral_volume_s4_covariance_gate.py --output verification_results/TETRAHEDRAL_VOLUME_S4_COVARIANCE_V3.json
      - name: Spectral registry and full magnetic covariance unit tests
        run: python -m unittest discover -s tests -p 'test_tetrahedral_volume_spectral.py'
      - name: Pairing-stabilizer structural theorem
        run: python scripts/lorentzian_pairing_stabilizer_orbit_gate.py --output verification_results/LORENTZIAN_PAIRING_STABILIZER_ORBITS_V3.json
      - name: Exact 16-cell Peter-Weyl H transport representation
        run: python scripts/collective_16cell_pairing_stabilizer_covariance_gate.py --output verification_results/COLLECTIVE_16CELL_PAIRING_STABILIZER_COVARIANCE_V3.json
      - name: Hard preregistration guards
        run: |
          python - <<'PY'
          import json
          a=json.load(open('verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT_V3.json'))
          b=json.load(open('verification_results/LORENTZIAN_PAIRING_STABILIZER_ORBITS_V3.json'))
          c=json.load(open('verification_results/COLLECTIVE_16CELL_PAIRING_STABILIZER_COVARIANCE_V3.json'))
          assert a['passed']
          assert a['checks']['charged_q123_preferred_leg_negative_control']
          assert a['checks']['tetra_CV_slot_covariance_restored']
          s=json.load(open('verification_results/TETRAHEDRAL_VOLUME_S4_COVARIANCE_V3.json'))
          assert s['passed'] and s['spin_quartets'] >= 5 and s['permutations_per_quartet'] == 24
          assert s['maximum_relative_covariance_defect'] < 1e-12
          assert b['passed'] and b['worker_orbits']==[[0,1,6,7,16,17,22,23],[2,4,8,10,13,15,19,21],[3,5,9,11,12,14,18,20]]
          assert c['passed'] and c['order']==8
          assert c['checks']['global_K0_seed_invariant']
          assert c['checks']['local_K_line_recoupling_exact']
          assert c['checks']['E_sparse_support_transport_exact']
          assert c['checks']['E_norm_preserved']
          assert c['checks']['U_group_law_on_E_orbit']
          assert c['checks']['U_inverse_roundtrip_on_E_orbit']
          assert c['max_U_group_law_error'] < 1e-9
          assert c['max_U_inverse_roundtrip_error'] < 1e-9
          # The historical one-dimensional E pseudoscalar character is diagnostic only.
          assert c['old_pseudoscalar_diagnostic']['hard_requirement'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-lorentzian-v3-preflight
          path: |
            verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT_V3.json
            verification_results/TETRAHEDRAL_CHARGED_VOLUME_SPECTRAL_MATRICES_V3.npz
            verification_results/TETRAHEDRAL_VOLUME_S4_COVARIANCE_V3.json
            verification_results/LORENTZIAN_PAIRING_STABILIZER_ORBITS_V3.json
            verification_results/COLLECTIVE_16CELL_PAIRING_STABILIZER_COVARIANCE_V3.json
          if-no-files-found: error

  v2-direct-baseline:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: [forward, adjoint]
        slot: [0,1,2,3]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Six direct V2 terms per shard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          python scripts/pl_lorentzian_group_worker_v2.py --mode "${{ matrix.mode }}" --first-slot ${{ matrix.slot }} --source 0 --out-dir out
      - name: Require six direct V2 terms
        shell: pwsh
        run: |
          $j=(Get-ChildItem out -Filter 'term_*.json').Count
          $n=(Get-ChildItem out -Filter 'term_*.npz').Count
          if ($j -ne 6 -or $n -ne 6) { throw "Expected 6 direct V2 JSON/NPZ terms; got $j/$n" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-lorentzian-v2-baseline-${{ matrix.mode }}-${{ matrix.slot }}
          path: out/
          if-no-files-found: error

  direct-shards:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mode: forward
            slot: 3
          - mode: adjoint
            slot: 1
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Six direct corrected-V2 terms with shared caches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          python scripts/pl_lorentzian_group_worker_v2.py --mode "${{ matrix.mode }}" --first-slot ${{ matrix.slot }} --source 0 --out-dir out
      - name: Require six direct terms
        shell: pwsh
        run: |
          $j=(Get-ChildItem out -Filter 'term_*.json').Count
          $n=(Get-ChildItem out -Filter 'term_*.npz').Count
          if ($j -ne 6 -or $n -ne 6) { throw "Expected 6 direct JSON/NPZ terms; got $j/$n" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-lorentzian-v3-direct-${{ matrix.mode }}
          path: out/
          if-no-files-found: error

  reconstruct-and-collect:
    needs: [direct-shards, v2-direct-baseline]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: pl-lorentzian-v3-direct-*
          path: direct
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pl-lorentzian-v2-baseline-*
          path: v2-direct
          merge-multiple: true
      - name: Require exactly twelve direct V2 terms
        shell: pwsh
        run: |
          $j=(Get-ChildItem direct -Filter 'term_*.json').Count
          $n=(Get-ChildItem direct -Filter 'term_*.npz').Count
          if ($j -ne 12 -or $n -ne 12) { throw "Expected 12 direct JSON/NPZ terms; got $j/$n" }
      - name: Validate six held-out orbit pairs and materialize complete 48-term orbit
        run: |
          python scripts/pl_lorentzian_orbit_reconstruct_v3.py --root direct --out-dir materialized --certificate verification_results/PL_16CELL_LORENTZIAN_V3_ORBIT_RECONSTRUCTION.json --source 0
      - name: Require complete materialized orbit
        shell: pwsh
        run: |
          $j=(Get-ChildItem materialized -Filter 'term_*.json').Count
          $n=(Get-ChildItem materialized -Filter 'term_*.npz').Count
          if ($j -ne 48 -or $n -ne 48) { throw "Expected 48 materialized JSON/NPZ terms; got $j/$n" }
      - name: Full physical Hermitian V3 collector
        run: |
          python scripts/pl_lorentzian_48_collect_v3.py --root materialized --orbit-certificate verification_results/PL_16CELL_LORENTZIAN_V3_ORBIT_RECONSTRUCTION.json --json-output verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V3.json --state-output verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V3.npz
      - name: Independent 48-direct V2 baseline collector
        run: |
          python scripts/pl_lorentzian_48_collect_v2.py --root v2-direct --json-output verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2_BASELINE.json --state-output verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2_BASELINE.npz
      - name: Compare all 48 complex term states and final bundles
        run: |
          python scripts/pl_lorentzian_v2_v3_complex_state_compare.py --v2-root v2-direct --v3-root materialized --v2-bundle verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2_BASELINE.npz --v3-bundle verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V3.npz --output verification_results/PL_16CELL_V2_V3_COMPLEX_STATE_COMPARISON.json
      - name: Final science guards
        run: |
          python - <<'PY'
          import json
          r=json.load(open('verification_results/PL_16CELL_LORENTZIAN_V3_ORBIT_RECONSTRUCTION.json'))
          d=json.load(open('verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V3.json'))
          assert r['passed'] and len(r['validation_pairs'])==6 and all(x['passed'] for x in r['validation_pairs'])
          assert r['direct_term_count']==12 and r['reconstructed_term_count']==36
          assert d['passed']
          assert d['science_status']=='AMPLITUDE_PRECURSOR_S_NODE0_V3_ORBIT_EXACT'
          assert d['operator_version']=='tetrahedral-charged-volume-v2'
          assert d['direct_heavy_term_count']==12
          assert d['symmetry_reconstructed_term_count']==36
          assert d['max_worker_physical_leakage']<1e-8
          assert d['wrong_seed_parity_outputs']==0
          assert d['max_spin_S']<=3.5+1e-12
          v2=json.load(open('verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2_BASELINE.json'))
          x=json.load(open('verification_results/PL_16CELL_V2_V3_COMPLEX_STATE_COMPARISON.json'))
          assert v2['passed'] and v2['worker_count']==48
          assert x['passed']
          assert x['max_term_relative_complex_state_error'] < 1e-8
          assert x['max_bundle_relative_complex_state_error'] < 1e-8
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-16cell-hermitian-lorentzian-v3-orbit
          path: |
            verification_results/PL_16CELL_LORENTZIAN_V3_ORBIT_RECONSTRUCTION.json
            verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V3.json
            verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V3.npz
            verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2_BASELINE.json
            verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2_BASELINE.npz
            verification_results/PL_16CELL_V2_V3_COMPLEX_STATE_COMPARISON.json
          if-no-files-found: error
