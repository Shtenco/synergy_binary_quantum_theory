name: python-all-branches-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.pyi'
      - '**.pyx'
      - '**.pxd'
      - '**.ipynb'
      - '**.tar.gz.b64'
      - '**.tgz.b64'
      - '**.zip.b64'
      - '**.tar.gz'
      - '**.tgz'
      - '**.tar.bz2'
      - '**.tar.xz'
      - '**.tar'
      - '**.zip'
      - '**.whl'
      - '**.egg'
      - '.github/workflows/python-all-branches-audit.yml'

permissions:
  contents: read

concurrency:
  group: python-all-branches-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shallow snapshots for every branch head
        run: git fetch --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enumerate and statically audit Python blobs across every branch head
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m py_compile scripts/audit_python_all_branch_heads.py
          python scripts/audit_python_all_branch_heads.py --out verification_results/PYTHON_ALL_BRANCHES_AUDIT.json
      - name: Build deduplicated LZMA snapshot of all branch-head Git blobs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m py_compile scripts/bqg_branch_snapshot_lzma.py
          python scripts/test_bqg_branch_snapshot_lzma.py
          python scripts/bqg_branch_snapshot_lzma.py \
            --out verification_results/BQG_BRANCH_SNAPSHOT_2026-11-11.tar.xz \
            --manifest-out verification_results/BQG_BRANCH_SNAPSHOT_2026-11-11.manifest.json
      - name: Upload complete branch-wide audit and LZMA source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-all-branches-audit-and-lzma-snapshot
          path: |
            verification_results/PYTHON_ALL_BRANCHES_AUDIT.json
            verification_results/BQG_BRANCH_SNAPSHOT_2026-11-11.tar.xz
            verification_results/BQG_BRANCH_SNAPSHOT_2026-11-11.manifest.json
          if-no-files-found: error
