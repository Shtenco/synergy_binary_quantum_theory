name: bqg-he-sine-multinode-charge-covariance
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg-he-sine-multinode-charge-covariance.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-sine-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - {source: 0, target: 1}
          - {source: 1, target: 2}
          - {source: 1, target: 3}
          - {source: 1, target: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Full genuine H_E sine on independent K5 source/charge-node pairs
        env:
          SRC: ${{ matrix.source }}
          DST: ${{ matrix.target }}
        run: python -u scripts/bqg_he_sine_full_cutoff_refinement.py --source "$SRC" --target "$DST" --Jmax2 3
