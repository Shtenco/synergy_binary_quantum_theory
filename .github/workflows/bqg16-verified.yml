name: bqg16-verified
on:
  push:
    branches:
      - research/bqg-node1-lorentzian-columns-20261031
    paths:
      - .github/workflows/bqg16-verified.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-gram:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          run-id: 41294081280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: node1-kb-000
          path: data
      - uses: actions/download-artifact@v4
        with:
          run-id: 41304021860
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: node1-ka-key-*
          merge-multiple: true
          path: data
      - uses: actions/download-artifact@v4
        with:
          run-id: 41309076252
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: bqg-node1-ka-lowspin-*
          merge-multiple: true
          path: data
      - name: SHA-verified exact physical-source Gram 16
        run: python -u scripts/bqg16_smoke_20261104.py
