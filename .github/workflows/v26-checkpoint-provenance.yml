name: v26-checkpoint-provenance

on:
  workflow_dispatch:
  push:
    branches:
      - research/bqg-v26-multiprecision-charge-20261109
      - audit/v26-strict-leakage-20261110
    paths:
      - 'scripts/bqg_lorentzian_checkpointed_triple.py'
      - 'scripts/bqg_lorentzian_ka_partition.py'
      - 'tests/test_bqg_lorentzian_checkpoint_provenance.py'
      - '.github/workflows/v26-checkpoint-provenance.yml'

permissions:
  contents: read

concurrency:
  group: v26-checkpoint-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy sympy
      - name: Compile checkpoint workers
        run: |
          python -m py_compile scripts/bqg_lorentzian_checkpointed_triple.py
          python -m py_compile scripts/bqg_lorentzian_ka_partition.py
      - name: Test source closure and partition provenance
        run: python -m unittest discover -s tests -p 'test_bqg_lorentzian_checkpoint_provenance.py'
      - name: Repeat under optimized Python
        run: python -O -m unittest discover -s tests -p 'test_bqg_lorentzian_checkpoint_provenance.py'
