name: BQG physical history and causal response reference gates

on:
  push:
    branches: [research/physical-history-causality-20261112, research/bqg-causal-cone-audit-hardening-20261113]
    paths:
      - 'scripts/bqg_physical_history_decoherence_engine.py'
      - 'tests/test_bqg_physical_history_decoherence_engine.py'
      - 'scripts/master_constraint_physical_projector_gate.py'
      - 'scripts/q2_relational_history_projector_gate.py'
      - 'scripts/q2_relational_metric_source_gate.py'
      - 'scripts/bqg_projector_only_causality_nogo_gate.py'
      - 'scripts/bqg_graph_changing_causal_order_gate.py'
      - 'scripts/bqg_causal_cone_w5_certificate.py'
      - 'BQG_GRAPH_CHANGING_CAUSAL_ORDER_THEOREM.md'
      - 'BQG_PROJECTOR_ONLY_CAUSALITY_NOGO.md'
      - 'scripts/bqg_sharp_analytic_causal_cone_gate.py'
      - 'scripts/lemaitre_bqg_cone_reference_gate.py'
      - 'BQG_SHARP_ANALYTIC_CAUSAL_CONE.md'
      - 'LEMAITRE_BQG_CAUSAL_CONE_BENCHMARK.md'
      - 'BQG_PHYSICAL_PROBABILITY_AND_CAUSALITY_FRONTIER_20261112.md'
      - 'physicalization_gates.json'
      - 'scripts/verify_physicalization_gates.py'
      - '.github/workflows/bqg-physical-history-causality.yml'
  pull_request:
    branches: [main, research/lemaitre-bqg-causal-cone-20261110]
    paths:
      - 'scripts/bqg_physical_history_decoherence_engine.py'
      - 'tests/test_bqg_physical_history_decoherence_engine.py'
      - 'scripts/master_constraint_physical_projector_gate.py'
      - 'scripts/q2_relational_history_projector_gate.py'
      - 'scripts/q2_relational_metric_source_gate.py'
      - 'scripts/bqg_projector_only_causality_nogo_gate.py'
      - 'scripts/bqg_graph_changing_causal_order_gate.py'
      - 'scripts/bqg_causal_cone_w5_certificate.py'
      - 'BQG_GRAPH_CHANGING_CAUSAL_ORDER_THEOREM.md'
      - 'BQG_PROJECTOR_ONLY_CAUSALITY_NOGO.md'
      - 'BQG_PHYSICAL_PROBABILITY_AND_CAUSALITY_FRONTIER_20261112.md'
      - 'physicalization_gates.json'
      - 'scripts/verify_physicalization_gates.py'
      - '.github/workflows/bqg-physical-history-causality.yml'

permissions:
  contents: read

concurrency:
  group: bqg-physical-history-causality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-reference-and-open-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Compile and run physical-history reference engine
        run: |
          python -W error::SyntaxWarning -m py_compile scripts/q2_relational_history_projector_gate.py
          python -m py_compile scripts/bqg_physical_history_decoherence_engine.py
          python -m py_compile scripts/master_constraint_physical_projector_gate.py scripts/q2_relational_metric_source_gate.py
          python -m py_compile scripts/bqg_projector_only_causality_nogo_gate.py scripts/bqg_graph_changing_causal_order_gate.py scripts/bqg_causal_cone_w5_certificate.py
          python scripts/bqg_physical_history_decoherence_engine.py > physical_history_reference.json
      - name: Run finite projector, relational-clock and graph-causality controls
        run: |
          mkdir -p verification_results
          python scripts/master_constraint_physical_projector_gate.py --output verification_results/master_projector.json
          python scripts/q2_relational_history_projector_gate.py --output verification_results/relational_history.json
          python scripts/q2_relational_metric_source_gate.py --output verification_results/relational_metric_source.json
          python scripts/bqg_projector_only_causality_nogo_gate.py
          python scripts/bqg_graph_changing_causal_order_gate.py
          python scripts/bqg_causal_cone_w5_certificate.py > verification_results/w5_cone_certificate.txt
      - name: Upload finite causal-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-finite-causal-controls-run-${{ github.run_id }}
          path: verification_results/
          if-no-files-found: warn
      - name: Run reduced analytic cone and independent reference comparison
        run: |
          python scripts/bqg_sharp_analytic_causal_cone_gate.py
          python scripts/lemaitre_bqg_cone_reference_gate.py --output causal_cone_reference.json
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_bqg_physical_history_decoherence_engine.py' -v
      - name: Validate physicalization ledger and supplemental OPEN gates
        run: |
          python scripts/verify_physicalization_gates.py --output physicalization_frontier.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('physicalization_frontier.json').read_text())
          assert r['valid'] is True
          assert r['physicalization_complete'] is False
          assert set(r['supplemental_physical_gate_statuses'].values()) == {'open_physical'}
          print('physicalization ledger valid; all new physical gates remain OPEN')
          PY
      - name: Enforce fail-closed physical status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('physical_history_reference.json').read_text())
          assert r['status'] == 'PASS_REFERENCE_ONLY'
          assert 'OPEN_PHYSICAL' in r['physical_gates']
          print('reference tests PASS; physical derivation remains OPEN_PHYSICAL')
          PY
