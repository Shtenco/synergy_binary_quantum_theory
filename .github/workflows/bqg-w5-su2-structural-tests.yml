name: BQG W5 SU2 structural support tests

on:
  push:
    branches:
      - research/bqg-fs-symplectic-reduction-20261128
    paths:
      - 'scripts/bqg_w5_su2_structural_basis.py'
      - 'tests/test_bqg_w5_su2_structural_basis.py'
      - 'scripts/bqg_w5_structural_pilot.py'
      - '.github/workflows/bqg-w5-su2-structural-tests.yml'

jobs:
  structural-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy and SymPy for imported Peter-Weyl word definitions
        run: python -m pip install numpy sympy
      - name: Run threshold-free structural basis tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p 'test_bqg_w5_su2_structural_basis.py' -v
      - name: Run bounded one-triple structural pilot
        env:
          PYTHONPATH: scripts
        run: python scripts/bqg_w5_structural_pilot.py --Jmax2 2 --max-states 5000 --source 0 --triple 1 2 3
      - name: Run bounded pilot on actual W5 K=0 seed
        env:
          PYTHONPATH: scripts
        run: python scripts/bqg_w5_structural_pilot.py --Jmax2 10 --max-states 5000 --source 0 --triple 1 2 3 --w5-K 0
