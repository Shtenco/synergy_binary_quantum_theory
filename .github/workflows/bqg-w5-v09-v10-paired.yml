name: W5 paired V09 V10 seed and cutoff audit

on:
  push:
    branches:
      - research/w5-v09-v10-repro-20261119
    paths:
      - '.github/workflows/bqg-w5-v09-v10-paired.yml'
      - 'scripts/bqg_v09_v10_paired_regression.py'
      - 'scripts/bqg_v09_v10_paired_aggregate.py'
      - 'tests/test_bqg_v09_v10_paired_aggregate.py'
      - 'scripts/archive/bqg_v09_w5_lorentzian_raw_column_v09_frozen.py'
      - 'scripts/archive/W5_V09_FROZEN_BASELINE.txt'
      - 'scripts/bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/peter_weyl_covariant_K_sine_composition_gate.py'
      - 'tests/test_bqg_v09_v10_paired_regression.py'
  pull_request:
    branches:
      - research/bqg-intrinsic-clock-lorentzian-bridge-20261116
    paths:
      - '.github/workflows/bqg-w5-v09-v10-paired.yml'
      - 'scripts/bqg_v09_v10_paired_regression.py'
      - 'scripts/bqg_v09_v10_paired_aggregate.py'
      - 'tests/test_bqg_v09_v10_paired_regression.py'
      - 'tests/test_bqg_v09_v10_paired_aggregate.py'
  workflow_dispatch:

concurrency:
  group: bqg-w5-v09-v10-paired-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paired-regression:
    name: W5 paired V09/V10 Jmax2=${{ matrix.jmax2 }} mode=${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        jmax2: [10, 12, 14]
        mode: [shadow_no_prune, production]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy sympy
      - name: Compile paired W5 audit modules
        run: |
          python -m py_compile scripts/archive/bqg_v09_w5_lorentzian_raw_column_v09_frozen.py
          python -m py_compile scripts/bqg_v10_w5_lorentzian_adjoint_closure.py
          python -m py_compile scripts/bqg_v09_v10_paired_regression.py
          python -m py_compile scripts/bqg_v09_v10_paired_aggregate.py
          python -m py_compile scripts/peter_weyl_euclidean_sine_ordering_gate.py
          python -m py_compile scripts/peter_weyl_covariant_K_sine_composition_gate.py
      - name: Run paired-regression invariant tests
        run: python -m unittest discover -s tests -p 'test_bqg_v09_v10_paired_regression.py' -v
      - name: Run original V09 and V10 regression suites
        run: |
          python -m unittest discover -s tests -p 'test_bqg_v09_w5_lorentzian_raw_column.py' -v
          python -m unittest discover -s tests -p 'test_bqg_v10_w5_lorentzian_adjoint_closure.py' -v
      - name: Compare all five W5 seeds on the identical source node and cutoff
        run: |
          mkdir -p verification_results
          python scripts/bqg_v09_v10_paired_regression.py \
            --node 0 \
            --Jmax2 ${{ matrix.jmax2 }} \
            --mode ${{ matrix.mode }} \
            --output verification_results/W5_V09_V10_NODE0_J${{ matrix.jmax2 }}_${{ matrix.mode }}_${{ github.run_id }}.json
      - name: Upload paired numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-v09-v10-node0-j${{ matrix.jmax2 }}-${{ matrix.mode }}-run${{ github.run_id }}
          path: verification_results/W5_V09_V10_NODE0_J${{ matrix.jmax2 }}_${{ matrix.mode }}_${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-paired-audit:
    name: Aggregate pruning and Jmax2 convergence
    if: always()
    needs: [paired-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download six paired reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bqg-w5-v09-v10-node0-j*-*-run${{ github.run_id }}
          path: verification_results/paired_reports
          merge-multiple: true
      - name: Run paired pruning and cutoff convergence aggregate
        if: always()
        run: |
          python -m py_compile scripts/bqg_v09_v10_paired_aggregate.py
          python -m unittest discover -s tests -p 'test_bqg_v09_v10_paired_aggregate.py' -v
          python scripts/bqg_v09_v10_paired_aggregate.py \
            --input-dir verification_results/paired_reports \
            --output verification_results/W5_V09_V10_PAIRED_AGGREGATE_${{ github.run_id }}.json
      - name: Upload aggregate verdict and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-v09-v10-paired-aggregate-run${{ github.run_id }}
          path: verification_results/W5_V09_V10_PAIRED_AGGREGATE_${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30
