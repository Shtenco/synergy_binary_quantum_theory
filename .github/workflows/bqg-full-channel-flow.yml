name: BQG full channel flow matrix
# 2026-11-10: execute the complete ancestry matrix after the lowest-channel no-go.

on:
  push:
    branches: [main, audit/rg-refinement-strict-20261110]
    paths:
      - 'scripts/bqg_full_channel_flow_matrix.py'
      - 'scripts/bqg_rg_ancestry_path.py'
      - 'tests/test_bqg_full_channel_flow_matrix.py'
      - 'tests/test_bqg_rg_ancestry_path.py'
      - '.github/workflows/bqg-full-channel-flow.yml'
  workflow_dispatch:

jobs:
  flow:
    strategy:
      fail-fast: false
      matrix:
        s2: [3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Test strict refinement diagnostics and RG ancestry provenance
        run: |
          python -m unittest discover -s tests -p 'test_bqg_full_channel_flow_matrix.py'
          python -m unittest discover -s tests -p 'test_bqg_rg_ancestry_path.py'
      - name: Compute full channel-flow matrix
        run: |
          mkdir -p verification_results
          python scripts/bqg_full_channel_flow_matrix.py \
            --s2 ${{ matrix.s2 }} \
            --output verification_results/BQG_FULL_CHANNEL_FLOW_S2_${{ matrix.s2 }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-full-channel-flow-s2-${{ matrix.s2 }}
          path: verification_results/BQG_FULL_CHANNEL_FLOW_S2_${{ matrix.s2 }}.json
          retention-days: 30
