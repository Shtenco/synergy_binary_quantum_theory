name: BQG full channel flow matrix
# 2026-11-10: execute the complete ancestry matrix after the lowest-channel no-go.

on:
  push:
    branches: [main, audit/rg-refinement-strict-20261110]
    paths:
      - 'scripts/bqg_full_channel_flow_matrix.py'
      - 'scripts/bqg_rg_ancestry_path.py'
      - 'tests/test_bqg_full_channel_flow_matrix.py'
      - 'tests/test_bqg_rg_ancestry_path.py'
      - '.github/workflows/bqg-full-channel-flow.yml'
  workflow_dispatch:

concurrency:
  group: bqg-full-channel-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flow:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        s2: [3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Test strict refinement diagnostics and RG ancestry provenance
        run: |
          python -m unittest discover -s tests -p 'test_bqg_full_channel_flow_matrix.py'
          python -m unittest discover -s tests -p 'test_bqg_rg_ancestry_path.py'
      - name: Compute full channel-flow matrix
        run: |
          mkdir -p verification_results
          python scripts/bqg_full_channel_flow_matrix.py \
            --s2 ${{ matrix.s2 }} \
            --output verification_results/BQG_FULL_CHANNEL_FLOW_S2_${{ matrix.s2 }}.json
      - name: Pin exact workflow provenance into numerical shard
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          S2: ${{ matrix.s2 }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(f"verification_results/BQG_FULL_CHANNEL_FLOW_S2_{os.environ['S2']}.json")
          d=json.loads(p.read_text())
          d["workflow_run_id"]=int(os.environ["GITHUB_RUN_ID"])
          d["workflow_commit"]=os.environ["GITHUB_SHA"]
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-full-channel-flow-s2-${{ matrix.s2 }}
          path: verification_results/BQG_FULL_CHANNEL_FLOW_S2_${{ matrix.s2 }}.json
          retention-days: 30

  ancestry:
    needs: flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade numpy
      - name: Download every consecutive flow shard from this run
        uses: actions/download-artifact@v4
        with:
          pattern: bqg-full-channel-flow-s2-*
          path: verification_results/flows
          merge-multiple: true
      - name: Validate complete provenance and six-step spectral continuity
        run: |
          python scripts/bqg_rg_ancestry_path.py verification_results/flows/*.json \
            --require-refinement-spectra \
            --output verification_results/BQG_RG_ANCESTRY_PATH_6STEP.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-rg-ancestry-six-step
          path: verification_results/BQG_RG_ANCESTRY_PATH_6STEP.json
          if-no-files-found: error

  direct-composition:
    needs: flow
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source_s2: [3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Download one-step matrices from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: bqg-full-channel-flow-s2-*
          path: verification_results/flows
          merge-multiple: true
      - name: Compile direct composition gate
        run: python -m py_compile scripts/bqg_two_step_channel_composition.py
      - name: Compare direct microscopic composition with scalar matrix product
        run: |
          python scripts/bqg_two_step_channel_composition.py \
            --source-s2 ${{ matrix.source_s2 }} \
            --reference-dir verification_results/flows \
            --output verification_results/compositions/BQG_TWO_STEP_CHANNEL_COMPOSITION_S2_${{ matrix.source_s2 }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bqg-two-step-composition-s2-${{ matrix.source_s2 }}
          path: verification_results/compositions/BQG_TWO_STEP_CHANNEL_COMPOSITION_S2_${{ matrix.source_s2 }}.json
          if-no-files-found: warn
          retention-days: 30
