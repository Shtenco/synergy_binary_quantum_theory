name: bqg20-residual-gate
on:
  push:
    branches: [research/bqg-node1-lorentzian-columns-20261031]
    paths: [.github/workflows/bqg20-residual-gate.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  exact-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          run-id: 41294081280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: node1-kb-000
          path: checkpoint
      - name: SHA-checked actual 100-key input residual and strict conditional bound
        run: python -u scripts/bqg_node1_residual_operator_bound_gate.py --checkpoint-dir checkpoint
