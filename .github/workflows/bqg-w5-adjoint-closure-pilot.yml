name: BQG W5 adjoint closure pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bqg-w5-adjoint-closure-pilot.yml'
      - 'scripts/bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'scripts/peter_weyl_*.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'

permissions:
  contents: read

jobs:
  w5-seed-column-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy sympy
      - name: Run five W5 seeds at one K5 node
        run: |
          python scripts/bqg_v10_w5_lorentzian_adjoint_closure.py \
            --nodes 0 --Jmax2 10 --max-states 5 --max-depth 0 \
            --amp-tol 1e-12 \
            --output verification_results/W5_ADJOINT_NODE0_J10_SEED_PILOT.json
      - name: Upload numerical result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-adjoint-node0-j10-seed-pilot
          path: verification_results/W5_ADJOINT_NODE0_J10_SEED_PILOT.json
          if-no-files-found: warn
