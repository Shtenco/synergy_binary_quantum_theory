name: BQG v16 REAL PL16 Lorentzian first-leg probe
on:
  push:
    branches:
      - research/bqg-v16-first-leg-20261107
    paths:
      - scripts/pl_v16_first_leg_probe.py
      - .github/workflows/bqg-v16-true-first-lorentzian-leg.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bqg-v16-first-leg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical-cv-first-leg:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production scientific backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: Compile and verify original PL16 imports
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/pl_v16_first_leg_probe.py
          export PYTHONPATH=scripts
          python -c "import pl_lorentzian_physical_pair_worker_v4, tetrahedral_volume_backend, pl_dual_complex"
          if ($LASTEXITCODE -ne 0) { exit 2 }
      - name: Execute REAL V4 first leg C(V) without fitting or approximation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pl_v16_first_leg_probe.py --index 0 --output-prefix out/stage1
          if ($LASTEXITCODE -ne 0) { exit 2 }
          python -c "import json,os; d=json.load(open('out/stage1.json')); assert d['passed'] and not d['full_pair_completed']; assert d['source_commit']==os.environ['GITHUB_SHA']"
          if ($LASTEXITCODE -ne 0) { exit 2 }
      - name: Save physical intermediate or explicit failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-v16-true-pl16-CV-first-leg
          path: out/
          if-no-files-found: error
          retention-days: 90
