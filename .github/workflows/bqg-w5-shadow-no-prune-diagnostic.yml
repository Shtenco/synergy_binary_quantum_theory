name: BQG W5 shadow no-prune scalar-selection diagnostic

on:
  push:
    branches:
      - research/bqg-w5-production-audit-20261113
    paths:
      - '.github/workflows/bqg-w5-shadow-no-prune-diagnostic.yml'
      - 'scripts/bqg_v10_w5_lorentzian_adjoint_closure.py'
      - 'scripts/bqg_pruning_coverage_inventory.py'
      - 'scripts/bqg_pruning_audit.py'
      - 'scripts/peter_weyl_lorentzian_sine_ordered_triple_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_cached_gate.py'
      - 'scripts/peter_weyl_covariant_K_composition_gate.py'
      - 'scripts/peter_weyl_covariant_K_leg_gate.py'
      - 'scripts/peter_weyl_covariant_K_sine_composition_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-scalar-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy sympy
      - name: Run one-node W5 shadow diagnostic with all instrumented pruning bypassed
        shell: bash
        run: |
          set +e
          python scripts/bqg_v10_w5_lorentzian_adjoint_closure.py \
            --nodes 0 --Jmax2 10 --max-states 5 --max-depth 0 \
            --amp-tol 0 --pruning-mode shadow_no_prune \
            --output verification_results/W5_SHADOW_SCALAR_SELECTION_NODE0_J10.json
          rc=$?
          set -e
          test -f verification_results/W5_SHADOW_SCALAR_SELECTION_NODE0_J10.json
          python - "$rc" verification_results/W5_SHADOW_SCALAR_SELECTION_NODE0_J10.json <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          result = json.load(open(sys.argv[2], encoding="utf-8"))
          print(json.dumps({
              "process_returncode": rc,
              "status": result.get("status"),
              "algebraic_status": result.get("algebraic_status"),
              "pruning_mode": result.get("pruning_mode"),
              "lower_level_pruning_coverage_complete": result.get("lower_level_pruning_ledger", {}).get("coverage", {}).get("complete"),
              "diagnostics": result.get("diagnostics", result.get("partial_diagnostics")),
              "claim_scope": result.get("claim_scope"),
          }, indent=2))
          assert result.get("pruning_mode") == "shadow_no_prune"
          assert rc in (0, 2)
          PY
      - name: Upload shadow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-w5-shadow-scalar-selection-run-${{ github.run_id }}
          path: verification_results/W5_SHADOW_SCALAR_SELECTION_NODE0_J10.json
          if-no-files-found: warn
          retention-days: 30
