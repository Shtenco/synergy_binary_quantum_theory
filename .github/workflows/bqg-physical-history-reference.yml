name: BQG physical-history reference diagnostics

on:
  push:
    branches: ['**']
    paths:
      - 'BQG_PHYSICAL_PROBABILITY_AND_CAUSALITY_FRONTIER_20261112.md'
      - 'BQG_PHYSICAL_CAUSAL_CONE_AUDIT_20261111.md'
      - 'LEMAITRE_BQG_CAUSAL_CONE_BENCHMARK.md'
      - 'scripts/bqg_physical_history_decoherence_engine.py'
      - 'tests/test_bqg_physical_history_decoherence_engine.py'
      - '.github/workflows/bqg-physical-history-reference.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'BQG_PHYSICAL_PROBABILITY_AND_CAUSALITY_FRONTIER_20261112.md'
      - 'BQG_PHYSICAL_CAUSAL_CONE_AUDIT_20261111.md'
      - 'LEMAITRE_BQG_CAUSAL_CONE_BENCHMARK.md'
      - 'scripts/bqg_physical_history_decoherence_engine.py'
      - 'tests/test_bqg_physical_history_decoherence_engine.py'
      - '.github/workflows/bqg-physical-history-reference.yml'

permissions:
  contents: read

concurrency:
  group: bqg-physical-history-reference-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  finite-reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Compile source and tests
        run: python -m py_compile scripts/bqg_physical_history_decoherence_engine.py tests/test_bqg_physical_history_decoherence_engine.py
      - name: Run finite reference engine
        run: python scripts/bqg_physical_history_decoherence_engine.py > verification_results/PHYSICAL_HISTORY_REFERENCE.json
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_bqg_physical_history_decoherence_engine.py' -v
      - name: Enforce fail-closed physical status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('verification_results/PHYSICAL_HISTORY_REFERENCE.json').read_text())
          assert r['status'] == 'PASS_REFERENCE_ONLY'
          assert 'OPEN_PHYSICAL' in r['physical_gates']
          print('finite references pass; physical BQG gates remain open')
          PY
      - name: Upload reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-physical-history-reference-diagnostics
          path: verification_results/PHYSICAL_HISTORY_REFERENCE.json
          if-no-files-found: error
