<rect x="1125" y="205" width="210" height="175" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="1149" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">5 · IR action</text><text x="1149" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Ward + vertices</text>
<line x1="300" y1="292" x2="330" y2="292" stroke="#48dede" stroke-width="3"  /><line x1="565" y1="292" x2="595" y2="292" stroke="#48dede" stroke-width="3"  /><line x1="830" y1="292" x2="860" y2="292" stroke="#48dede" stroke-width="3"  /><line x1="1095" y1="292" x2="1125" y2="292" stroke="#48dede" stroke-width="3"  />
<rect x="185" y="485" width="1030" height="140" rx="22" fill="#102743" stroke="#ad8cff" stroke-width="2"/>
<text x="700" y="540" text-anchor="middle" fill="#f3f6ff" font-size="27" font-weight="700" font-family="Inter,Arial,sans-serif">Einstein–Hilbert / interacting TT pole</text>
<text x="700" y="585" text-anchor="middle" fill="#b8c9e4" font-size="19" font-family="Inter,Arial,sans-serif">цель исследовательской программы · не текущий доказанный результат</text>

