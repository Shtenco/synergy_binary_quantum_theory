<rect x="330" y="205" width="235" height="175" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="354" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">2 · HDA</text><text x="354" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Лоренцева алгебра</text>
