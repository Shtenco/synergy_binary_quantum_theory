<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Walsh-кодирование: четыре бинарных состояния → тетраэдр</title><desc id="desc">Проекция четырёх единичных векторов с одинаковым попарным углом</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#111d3c"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0df"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad8cff"/><stop offset="1" stop-color="#6c6bff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d95bd" opacity=".24"/></pattern>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect width="1400" height="820" rx="28" fill="url(#dots)"/>
<text x="72" y="78" fill="#f5f8ff" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">Walsh-кодирование: четыре бинарных состояния → тетраэдр</text>
<text x="74" y="118" fill="#a9bad9" font-size="19" font-family="Inter,Arial,sans-serif">Проекция четырёх единичных векторов с одинаковым попарным углом</text>

<line x1="430" y1="555" x2="700" y2="215" stroke="#6f8cb8" stroke-width="4"  /><line x1="430" y1="555" x2="970" y2="555" stroke="#6f8cb8" stroke-width="4"  /><line x1="700" y1="215" x2="970" y2="555" stroke="#6f8cb8" stroke-width="4"  /><line x1="430" y1="555" x2="700" y2="680" stroke="#6f8cb8" stroke-width="4"  /><line x1="700" y1="215" x2="700" y2="680" stroke="#6f8cb8" stroke-width="4"  /><line x1="970" y1="555" x2="700" y2="680" stroke="#6f8cb8" stroke-width="4"  />
<circle cx="430" cy="555" r="35" fill="#102a48" stroke="url(#cyan)" stroke-width="4"/><text x="430" y="562" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">00</text><circle cx="700" cy="215" r="35" fill="#102a48" stroke="url(#violet)" stroke-width="4"/><text x="700" y="222" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">01</text><circle cx="970" cy="555" r="35" fill="#102a48" stroke="url(#gold)" stroke-width="4"/><text x="970" y="562" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">10</text><circle cx="700" cy="680" r="35" fill="#102a48" stroke="url(#violet)" stroke-width="4"/><text x="700" y="687" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">11</text>
<rect x="80" y="190" width="270" height="155" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="104" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Три Walsh-знака</text><text x="104" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">(-1)^a, (-1)^b, (-1)^(a+b)</text>
<rect x="1050" y="190" width="270" height="155" rx="20" fill="#142746" stroke="url(#gold)" stroke-width="2"/><text x="1074" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Точная симметрия</text><text x="1074" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">nᵢ · nⱼ = −1/3</text>
<rect x="1050" y="405" width="270" height="155" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="1074" y="448" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Баланс</text><text x="1074" y="485" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Σ nᵢ = 0</text>
<text x="700" y="155" text-anchor="middle" fill="#a8c2e8" font-size="19" font-family="Inter,Arial,sans-serif">Каждое состояние — вершина; рёбра показывают геометрический носитель</text>
<text x="700" y="748" text-anchor="middle" fill="#48dede" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">Точный факт кодирования · не доказательство, что природа обязана выбрать этот код</text>

<path d="M72 760H1328" stroke="#344565" stroke-width="1"/><text x="74" y="790" fill="#91a4c7" font-size="15" font-family="Inter,Arial,sans-serif">BINARY QUANTUM GRAVITY · research visualization · schematic, not a claim of physical confirmation</text>
</svg>