<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Квантовая геометрия: от face-qubit к SU(2)</title><desc id="desc">Схематическая карта представлений и склейки; не изображение физической частицы</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#111d3c"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0df"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad8cff"/><stop offset="1" stop-color="#6c6bff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d95bd" opacity=".24"/></pattern>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect width="1400" height="820" rx="28" fill="url(#dots)"/>
<text x="72" y="78" fill="#f5f8ff" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">Квантовая геометрия: от face-qubit к SU(2)</text>
<text x="74" y="118" fill="#a9bad9" font-size="19" font-family="Inter,Arial,sans-serif">Схематическая карта представлений и склейки; не изображение физической частицы</text>

<rect x="80" y="190" width="280" height="145" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="104" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Face-qubit</text><text x="104" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Локальный бинарный носитель</text>
<rect x="430" y="190" width="280" height="145" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="454" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">SU(2)</text><text x="454" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Спиновые представления</text>
<rect x="780" y="190" width="280" height="145" rx="20" fill="#142746" stroke="url(#gold)" stroke-width="2"/><text x="804" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Peter–Weyl</text><text x="804" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Разложение по j и матричным элементам</text>
<rect x="1130" y="190" width="210" height="145" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="1154" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Склейка</text><text x="1154" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Gauss / intertwiner</text>
<line x1="360" y1="263" x2="430" y2="263" stroke="#48dede" stroke-width="4"  /><line x1="710" y1="263" x2="780" y2="263" stroke="#48dede" stroke-width="4"  /><line x1="1060" y1="263" x2="1130" y2="263" stroke="#48dede" stroke-width="4"  />
