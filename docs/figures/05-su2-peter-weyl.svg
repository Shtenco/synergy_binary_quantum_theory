 <circle cx="0" cy="0" r="44" fill="#143451" stroke="#48dede" stroke-width="3"/><circle cx="130" cy="0" r="44" fill="#143451" stroke="#ad8cff" stroke-width="3"/><circle cx="260" cy="0" r="44" fill="#143451" stroke="#ffd479" stroke-width="3"/>
