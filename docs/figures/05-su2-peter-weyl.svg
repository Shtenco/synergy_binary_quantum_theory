<text x="1110" y="540" fill="#ffd479" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">Representation bridge</text><text x="1110" y="575" fill="#c7d6ef" font-size="17" font-family="Inter,Arial,sans-serif">не завершённая</text><text x="1110" y="602" fill="#c7d6ef" font-size="17" font-family="Inter,Arial,sans-serif">физическая динамика</text>

<path d="M72 760H1328" stroke="#344565" stroke-width="1"/><text x="74" y="790" fill="#91a4c7" font-size="15" font-family="Inter,Arial,sans-serif">BINARY QUANTUM GRAVITY · research visualization · schematic, not a claim of physical confirmation</text>
