<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">HDA: главный тест канонической динамики</title><desc id="desc">Схема целевого равенства и текущего статуса доказательства</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#111d3c"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0df"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad8cff"/><stop offset="1" stop-color="#6c6bff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d95bd" opacity=".24"/></pattern>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect width="1400" height="820" rx="28" fill="url(#dots)"/>
<text x="72" y="78" fill="#f5f8ff" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">HDA: главный тест канонической динамики</text>
<text x="74" y="118" fill="#a9bad9" font-size="19" font-family="Inter,Arial,sans-serif">Схема целевого равенства и текущего статуса доказательства</text>

<rect x="110" y="185" width="1180" height="180" rx="22" fill="#102743" stroke="#48dede" stroke-width="2"/>
<text x="700" y="250" text-anchor="middle" fill="#f4f7ff" font-size="32" font-weight="700" font-family="Inter,Arial,sans-serif">[ H[N], H[M] ] / (iℏ)  ?=  D[qᵃᵇ(N∂ᵦM − M∂ᵦN)]</text>
<text x="700" y="305" text-anchor="middle" fill="#a9bddc" font-size="20" font-family="Inter,Arial,sans-serif">H — Hamiltonian constraint · D — independently defined diffeomorphism generator</text>
<rect x="110" y="435" width="340" height="150" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="134" y="478" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Что проверялось</text><text x="134" y="515" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Отдельные finite / Euclidean карты</text>
<rect x="530" y="435" width="340" height="150" rx="20" fill="#142746" stroke="url(#gold)" stroke-width="2"/><text x="554" y="478" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Что требуется</text><text x="554" y="515" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Off-shell Lorentzian closure + common domain</text>
<rect x="950" y="435" width="340" height="150" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="974" y="478" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Текущий статус</text><text x="974" y="515" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">OPEN · не объявлять закрытым</text>
<line x1="450" y1="510" x2="530" y2="510" stroke="#8aa1c8" stroke-width="3" stroke-dasharray="8 9" /><line x1="870" y1="510" x2="950" y2="510" stroke="#8aa1c8" stroke-width="3" stroke-dasharray="8 9" />
<text x="700" y="665" text-anchor="middle" fill="#ffcf83" font-size="20" font-weight="700" font-family="Inter,Arial,sans-serif">Относительная невязка → 0 сама по себе не доказывает абсолютное замыкание</text>

<path d="M72 760H1328" stroke="#344565" stroke-width="1"/><text x="74" y="790" fill="#91a4c7" font-size="15" font-family="Inter,Arial,sans-serif">BINARY QUANTUM GRAVITY · research visualization · schematic, not a claim of physical confirmation</text>
</svg>