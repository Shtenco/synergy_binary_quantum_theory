<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Ограничения и master constraint</title><desc id="desc">Точная конечномерная алгебраическая связь; существование ненулевого ядра отдельно не гарантируется</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#111d3c"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0df"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad8cff"/><stop offset="1" stop-color="#6c6bff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d95bd" opacity=".24"/></pattern>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect width="1400" height="820" rx="28" fill="url(#dots)"/>
<text x="72" y="78" fill="#f5f8ff" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">Ограничения и master constraint</text>
<text x="74" y="118" fill="#a9bad9" font-size="19" font-family="Inter,Arial,sans-serif">Точная конечномерная алгебраическая связь; существование ненулевого ядра отдельно не гарантируется</text>

<rect x="100" y="205" width="320" height="145" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="124" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Constraint map C</text><text x="124" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">|ψ⟩ ↦ (C₁|ψ⟩,…,Cₙ|ψ⟩)</text>
<rect x="540" y="205" width="320" height="145" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="564" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Positive metric G</text><text x="564" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">G > 0</text>
<rect x="980" y="205" width="320" height="145" rx="20" fill="#142746" stroke="url(#gold)" stroke-width="2"/><text x="1004" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Master operator</text><text x="1004" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">M_G = C† G C</text>
<line x1="420" y1="278" x2="540" y2="278" stroke="#48dede" stroke-width="4"  /><line x1="860" y1="278" x2="980" y2="278" stroke="#48dede" stroke-width="4"  />
<path d="M1140 350V435H700V505" fill="none" stroke="#48dede" stroke-width="4"/>
<rect x="450" y="505" width="500" height="135" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="474" y="548" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">Exact kernel identity</text><text x="474" y="585" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">ker M_G = ⋂ₐ ker Cₐ</text>
<text x="700" y="690" text-anchor="middle" fill="#ffd479" font-size="22" font-weight="700" font-family="Inter,Arial,sans-serif">Алгебраическая теорема ≠ доказательство ker C ≠ {0}</text>

<path d="M72 760H1328" stroke="#344565" stroke-width="1"/><text x="74" y="790" fill="#91a4c7" font-size="15" font-family="Inter,Arial,sans-serif">BINARY QUANTUM GRAVITY · research visualization · schematic, not a claim of physical confirmation</text>
</svg>