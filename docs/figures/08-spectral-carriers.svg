<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">W5 · W17 · W43: три разных конечных носителя</title><desc id="desc">Не соединять численные результаты без доказанного отображения между пространствами</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#111d3c"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0df"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad8cff"/><stop offset="1" stop-color="#6c6bff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d95bd" opacity=".24"/></pattern>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect width="1400" height="820" rx="28" fill="url(#dots)"/>
<text x="72" y="78" fill="#f5f8ff" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">W5 · W17 · W43: три разных конечных носителя</text>
<text x="74" y="118" fill="#a9bad9" font-size="19" font-family="Inter,Arial,sans-serif">Не соединять численные результаты без доказанного отображения между пространствами</text>

<rect x="95" y="205" width="350" height="245" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="119" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">W5 · K5</text><text x="119" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">5 × 5 Gram / спектральная граница</text>
<rect x="525" y="205" width="350" height="245" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="549" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">W17 · PL16</text><text x="549" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">E-only map; compression kernel ≠ physical kernel</text>
<rect x="955" y="205" width="350" height="245" rx="20" fill="#142746" stroke="url(#gold)" stroke-width="2"/><text x="979" y="248" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">W43 · PL16</text><text x="979" y="285" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Chiral imbalance; 11 compressed zeros</text>
<path d="M445 330H525M875 330H955" stroke="#ffcf83" stroke-width="3" stroke-dasharray="8 10"/>
<rect x="190" y="520" width="1020" height="115" rx="18" fill="#2a2032" stroke="#ffbd72" stroke-width="2"/>
<text x="700" y="565" text-anchor="middle" fill="#ffd7a0" font-size="24" font-weight="700" font-family="Inter,Arial,sans-serif">Осторожно: разные носители и разные операторы</text>
<text x="700" y="602" text-anchor="middle" fill="#e1d7cf" font-size="18" font-family="Inter,Arial,sans-serif">Числа, ранги и спектры нельзя переносить между ними без явного математического моста</text>

<path d="M72 760H1328" stroke="#344565" stroke-width="1"/><text x="74" y="790" fill="#91a4c7" font-size="15" font-family="Inter,Arial,sans-serif">BINARY QUANTUM GRAVITY · research visualization · schematic, not a claim of physical confirmation</text>
</svg>