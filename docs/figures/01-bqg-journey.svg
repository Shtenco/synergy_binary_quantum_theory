<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">От бинарного различия к исследовательской программе</title><desc id="desc">Карта пути: от конечных конструкций к открытым физическим проверкам</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#111d3c"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0df"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad8cff"/><stop offset="1" stop-color="#6c6bff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d95bd" opacity=".24"/></pattern>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect width="1400" height="820" rx="28" fill="url(#dots)"/>
<text x="72" y="78" fill="#f5f8ff" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">От бинарного различия к исследовательской программе</text>
<text x="74" y="118" fill="#a9bad9" font-size="19" font-family="Inter,Arial,sans-serif">Карта пути: от конечных конструкций к открытым физическим проверкам</text>

<rect x="70" y="190" width="220" height="130" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="94" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">01 · Бит</text><text x="94" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Два различимых состояния</text>
<rect x="365" y="190" width="220" height="130" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="389" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">02 · Код</text><text x="389" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Z₂² и Walsh-характеры</text>
