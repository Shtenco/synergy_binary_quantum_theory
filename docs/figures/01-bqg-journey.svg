<rect x="165" y="440" width="300" height="145" rx="20" fill="#142746" stroke="url(#gold)" stroke-width="2"/><text x="189" y="483" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">05 · Динамика</text><text x="189" y="520" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">H, master constraint, HDA</text>
<rect x="550" y="440" width="300" height="145" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="574" y="483" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">06 · Предел</text><text x="574" y="520" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">Физическое пространство и IR</text>
<rect x="935" y="440" width="300" height="145" rx="20" fill="#142746" stroke="url(#cyan)" stroke-width="2"/><text x="959" y="483" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">07 · Наблюдаемое</text><text x="959" y="520" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">TT-полюс, материя, тесты</text>
<line x1="1135" y1="320" x2="1135" y2="380" stroke="#48dede" stroke-width="4"  /><line x1="1135" y1="380" x2="315" y2="380" stroke="#48dede" stroke-width="4"  /><line x1="315" y1="380" x2="315" y2="440" stroke="#48dede" stroke-width="4"  />
<line x1="465" y1="512" x2="550" y2="512" stroke="#48dede" stroke-width="4"  /><line x1="850" y1="512" x2="935" y2="512" stroke="#48dede" stroke-width="4"  />
<text x="700" y="655" text-anchor="middle" fill="#ffd479" font-size="23" font-weight="700" font-family="Inter,Arial,sans-serif">Кандидатная теория: конечные результаты ≠ завершённая физическая теория</text>

<path d="M72 760H1328" stroke="#344565" stroke-width="1"/><text x="74" y="790" fill="#91a4c7" font-size="15" font-family="Inter,Arial,sans-serif">BINARY QUANTUM GRAVITY · research visualization · schematic, not a claim of physical confirmation</text>
