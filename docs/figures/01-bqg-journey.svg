<rect x="955" y="190" width="360" height="130" rx="20" fill="#142746" stroke="url(#violet)" stroke-width="2"/><text x="979" y="233" fill="#f3f7ff" font-size="25" font-weight="700" font-family="Inter,Arial,sans-serif">04 · Квантовая структура</text><text x="979" y="270" fill="#b3c4e0" font-size="17" font-family="Inter,Arial,sans-serif">SU(2), графы и ограничения</text>
