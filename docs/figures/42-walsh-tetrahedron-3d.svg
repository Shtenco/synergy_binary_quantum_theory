<text x="76" y="70" class="eyebrow">BINARY QUANTUM GEOMETRY · 3D VISUAL SERIES</text>
<text x="76" y="132" class="heading">От четырёх битовых меток к тетраэдру</text>
<text x="76" y="174" class="sub">Точная геометрия Walsh-носителя q=2 в трёхмерном пространстве</text>
<rect x="90" y="235" width="1420" height="610" rx="26" class="panel"/><polygon class="face" points="800.0,520.0 1129.1,710.0 470.9,710.0" /><polygon class="faceV" points="800.0,520.0 1129.1,710.0 800.0,140.0" /><polygon class="face" points="800.0,520.0 470.9,710.0 800.0,140.0" /><polygon class="faceV" points="1129.1,710.0 470.9,710.0 800.0,140.0" /><path class="edge" d="M800.0,520.0 L1129.1,710.0" /><path class="edge" d="M800.0,520.0 L470.9,710.0" /><path class="gold" d="M800.0,520.0 L800.0,140.0" /><path class="gold" d="M1129.1,710.0 L470.9,710.0" /><path class="edge" d="M1129.1,710.0 L800.0,140.0" /><path class="edge" d="M470.9,710.0 L800.0,140.0" /><circle cx="800" cy="520" r="12" class="node"/><text x="815" y="505" class="label" text-anchor="start">00</text><circle cx="1129.08" cy="710" r="12" class="node"/><text x="1144.08" y="695" class="label" text-anchor="start">01</text><circle cx="470.92" cy="710" r="12" class="node"/><text x="485.92" y="695" class="label" text-anchor="start">10</text><circle cx="800" cy="140" r="12" class="node"/><text x="815" y="125" class="label" text-anchor="start">11</text><text x="1240" y="320" class="label" text-anchor="start">Walsh-векторы</text><text x="1240" y="354" class="small" text-anchor="start">nₐ ∈ ℝ³, |nₐ| = 1</text><text x="1240" y="388" class="small" text-anchor="start">nₐ · nᵦ = −1/3, a ≠ b</text><text x="1240" y="422" class="small" text-anchor="start">Σₐ nₐ = 0</text><text x="1240" y="520" class="label" text-anchor="start">Точный результат</text><text x="1240" y="554" class="small" text-anchor="start">регулярный тетраэдр</text><text x="1240" y="588" class="small" text-anchor="start">из 4 меток Z₂²</text><text x="1240" y="650" class="label" text-anchor="start">Квантовый подъём</text><text x="1240" y="684" class="small" text-anchor="start">ρₐ = ½(I + nₐ·σ)</text>
<path d="M76 914H1524" stroke="#29435f"/>
<text x="76" y="950" class="tiny">Точная геометрия внутри объявленной конструкции; сама по себе не доказывает, что природа обязана выбирать этот носитель.</text>
