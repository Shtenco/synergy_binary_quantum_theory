<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Зеркальный порядок на dual-графе Q₄</title><desc id="desc">16 клеток 16-cell кодируются четырьмя битами; соседство — различие одного бита</desc>
<defs>
